# 체크온 AI — **공통** 스택: PostgreSQL 하나만. 맥(로컬 개발)·윈도우(배포) 양쪽이 쓴다.
#
# 🔴 이 파일에 app·migrate·cloudflared 를 넣지 마라. 그것들은 `docker-compose.deploy.yml`
#    이고, 맥은 앱을 컨테이너가 아니라 호스트에서 돌린다(`uv run uvicorn`).
#
# 사용법
#   맥      docker compose up -d            # db 만 뜬다 → ./scripts/dev_db_setup.sh
#   윈도우  .env 의 COMPOSE_FILE 이 아래 두 파일을 잇는다 ⇒ 같은 명령이 전체 스택을 띄운다
#             COMPOSE_FILE=docker-compose.yml:docker-compose.deploy.yml
#
# 포트·계정은 .env로 주입(하드코딩 금지). CI PG 서비스는 99 ⑫ 잔여.
# ⚠ POSTGRES_PORT 대체값은 5434(윈도우 기준)다 — 맥은 .env 에 5432 를 적는다.

services:
  db:
    image: postgres:16
    # Docker/WSL이 재시작되면 이 컨테이너만 내려가 있었다(2026-08-12 실측 — BE 실통신 중
    # 게이트가 "실 PG 미가용"으로 32건 skip). 다른 프로젝트 컨테이너들은 정책이 있어 살아났다.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-checkon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 가 .env 에 없다}
      POSTGRES_DB: ${POSTGRES_DB:-checkon_ai}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - checkon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-checkon} -d ${POSTGRES_DB:-checkon_ai}"]
      interval: 3s
      retries: 15

volumes:
  checkon_pgdata:
