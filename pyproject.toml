[project]
name = "checkon-ai"
version = "0.1.0"
description = "체크온 AI 서비스 — 위험신호 감지·상담 초안·엑셀 매핑"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.139.0",
    "greenlet>=3.5.3",
    "httpx>=0.28.1",
    "langchain-core>=1.4.9",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.1.0",
    "numpy>=2.5.1",
    "openai>=2.48.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.51",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

# 패키지 루트 = src/ai (src 레이아웃 — CLAUDE.md §4)
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E,F=pyflakes/pycodestyle · I=import 정렬 · UP=구식 문법 · B=버그유발 · ANN=타입힌트 누락
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ruff.lint.per-file-ignores]
# Alembic 마이그레이션은 metadata 에서 자동생성한다 — 긴 FK 제약명(E501)과
# alembic 관례 import 순서(I001)는 손대지 않는다(생성물 원형 유지).
"src/ai/db/migrations/versions/*" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests", "main.py"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
#: 🔴 `tests/ai/fakes`를 경로에 둔다 — 공용 대역을 평면 import한다
#: (`from counsel_text import draft` · `fake_provider` 선례).
#: ⚠ **디렉터리별 conftest로 넣지 않는다** — 아홉 디렉터리에 같은 세 줄이 생기고
#:   (#02 부류) mypy가 `conftest` 모듈 중복으로 막는다. 기존 둘은 그대로 뒀다.
pythonpath = ["src", "tests/ai/fakes"]
# 03_coding_rules §7 — 실 LLM·실 DB·외부 서비스 테스트는 마커로 분리, 기본 실행은 오프라인
markers = [
    "integration: 실 LLM·실 DB 호출 (기본 실행에서 제외)",
    "external: 명시적 옵트인으로만 실행하는 실 외부 서비스 스모크",
]
#: 🔴 `store_backend_pin`을 **플러그인으로** 싣는다(99 #39) — 기본값이 `pg`로 뒤집혀서
#: 오프라인 회귀는 `STORE_BACKEND=memory`를 **명시로** 골라야 한다(안 걸면 151건 red · 실측).
#: ⚠ conftest로 두면 mypy가 `conftest` 모듈 중복으로 막는다(위 주석과 같은 함정).
#: 🔴 `llm_provider_pin`도 같은 이유다(99 #57) — 개발자 `.env`의 `LLM_PROVIDER`가
#: 선언 기본값 `fake`를 덮어 **상시 6건 red**였고, 그 중 둘이 하필 「실물을 안 부른다」를
#: 지키는 가드였다. 가드가 빨간불이면 가드가 아니다.
#: 🔴 `console_env_pin`은 **같은 병의 두 번째 축**이다(99 #63) — `.env`의 `CONSOLE_*`가
#: 「기본 꺼짐」 가드 3건을 뒤집었고, 그 실패로 `pre_pr_verify`가 offline에서 멈춰
#: **integration 단계가 아예 안 돌았다.** ⚠ 이번은 `setdefault`가 아니라 `env_file`을
#: 끊는다 — 테스트가 `delenv`로 프로세스 env를 지우면 `.env`가 다시 이기기 때문이다.
addopts = "-m 'not integration and not external' -p store_backend_pin -p llm_provider_pin -p console_env_pin"
