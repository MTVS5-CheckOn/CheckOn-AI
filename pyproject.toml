[project]
name = "checkon-ai"
version = "0.1.0"
description = "체크온 AI 서비스 — 위험신호 감지·상담 초안·엑셀 매핑"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.139.0",
    "greenlet>=3.5.3",
    "httpx>=0.28.1",
    "langchain-core>=1.4.9",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.1.0",
    "numpy>=2.5.1",
    "openai>=2.48.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.51",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

# 패키지 루트 = src/ai (src 레이아웃 — CLAUDE.md §4)
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E,F=pyflakes/pycodestyle · I=import 정렬 · UP=구식 문법 · B=버그유발 · ANN=타입힌트 누락
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ruff.lint.per-file-ignores]
# Alembic 마이그레이션은 metadata 에서 자동생성한다 — 긴 FK 제약명(E501)과
# alembic 관례 import 순서(I001)는 손대지 않는다(생성물 원형 유지).
"src/ai/db/migrations/versions/*" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests", "main.py"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# 03_coding_rules §7 — 실 LLM·실 DB 테스트는 마커로 분리, 기본 실행은 오프라인
markers = [
    "integration: 실 LLM·실 DB 호출 (기본 실행에서 제외)",
]
addopts = "-m 'not integration'"
