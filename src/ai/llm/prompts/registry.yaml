schema_version: prompt-registry.v1
prompts:
  - prompt_id: pg.passage.v1
    version: v2
    role: generator
    template: problem_generation/passage.txt
    response_schema_name: PassageDraft
  - prompt_id: pg.source_material.v1
    version: v2
    role: generator
    template: problem_generation/source_material.txt
    response_schema_name: SourceMaterialDraft
  # v6(2026-08-20) — 오개념 닫힌 어휘 라벨 생성 지시 추가.
  # 🔴 프롬프트 문면이 바뀌면 버전이 바뀐다(불변식 8) — 같은 버전으로 다른 문면을 보내면
  # AI_RUN의 prompt_version이 재현 근거가 못 된다.
  - prompt_id: pg.items.v1
    version: v6
    role: generator
    template: problem_generation/items.txt
    response_schema_name: GeneratedItem
  # 🔴 **생성자와 같은 버전을 쓴다 — 짝이다.** `ProblemGenerationWorkflow`가
  # `generator.prompt_version != cross_solver.prompt_version`을 기동에서 거부한다.
  # 교차 풀이는 **그 생성물**을 검증하므로 한쪽 문면만 바뀌면 "무엇을 검증한 결과인가"가
  # 원장에서 갈린다(불변식 8). 문면 무변경이어도 짝을 따라 올린다(v4 → v5).
  - prompt_id: pg.cross_solve.v1
    version: v6
    role: verifier
    template: problem_generation/cross_solve.txt
    response_schema_name: SolveResult
  - prompt_id: pg.misconception_check.v1
    version: v6
    role: verifier
    template: problem_generation/misconception_check.txt
    response_schema_name: MisconceptionCheckResult
  - prompt_id: pg.refine.v1
    version: v5
    role: generator
    template: problem_generation/refine.txt
    response_schema_name: GeneratedItem
  - prompt_id: report.greeting.v1
    version: v1
    role: reporter
    template: report/greeting.txt
    response_schema_name: ReportNarrationDraft
  - prompt_id: report.fact.v1
    version: v1
    role: reporter
    template: report/fact.txt
    response_schema_name: ReportNarrationDraft
  - prompt_id: report.chart_analysis.v1
    version: v1
    role: reporter
    template: report/chart_analysis.txt
    response_schema_name: ReportNarrationDraft
  - prompt_id: report.suggestion.v1
    version: v1
    role: reporter
    template: report/suggestion.txt
    response_schema_name: ReportNarrationDraft
  - prompt_id: report.closing.v1
    version: v1
    role: reporter
    template: report/closing.txt
    response_schema_name: ReportNarrationDraft
  # 문의 분류(ⓑ) — 04 §3.5 · part_a/01 §4-ⓑ.
  # role=classifier는 `contracts/llm.py`의 `ModelRole.CLASSIFIER`("문의 분류·태깅 제안")다 —
  # 초기 커밋부터 있던 값이다. 종전 generator였고 "CLASSIFIER가 없어서"라는 주석이 붙어
  # 있었는데 **사실이 아니었다**(8/5 정정 · 99 ㊻ B-4).
  - prompt_id: classify.inquiry.v1
    version: v1
    role: classifier
    template: classify/inquiry.txt
    response_schema_name: ClassifyLlmOutput
