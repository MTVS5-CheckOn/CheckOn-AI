# refine 지시문 정적 차단 규칙 — `part_a/06_refine_policy.md` §3 C 분류
#
# **LLM 호출 전에** 거르는 것만 여기 있다(C 분류). 생성 후 판정(A1 근거 부재·A4 금칙)은
# 게이트가 하고 `refine.py`가 사유로 옮긴다 — 규칙을 두 곳에 두지 않는다.
#
# 패턴을 코드에 박지 않는다(03 §1). 어휘가 늘어도 코드 diff가 생기지 않아야 한다.
# 사유 코드는 `contracts/gates.BlockedReason`(양자 승인)의 값만 쓴다 — 새로 만들지 않는다.
version: "0.1"

rules:
  # A2·A3·A7 — teacher_only 지표 노출·타인 비교. 불변식 7(학부모向 조립 자체 금지)의
  # 지시문 층 방어다. A7(우회형 "슬쩍")도 표현이 아니라 **대상**으로 잡는다.
  - reason: comparison_exposure
    patterns:
      - 반 평균
      - 반평균
      - 학급 평균
      - 석차
      - 등수
      - 상위권
      - 하위권
      - 몇 등
      - 등급컷
      - 옆 반
      - 다른 학생
      - 다른 아이
      - 친구들보다
      - 보다 잘한다
      - 보다 못한다
      - 비교해서

  # A5 — 실명·연락처 삽입 지시. 마스킹이 입력을 지켜도 **지시로 되살리는 경로**를 막는다.
  - reason: pii_exposure
    patterns:
      - 실명
      - 본명
      - 전화번호
      - 연락처
      - 휴대폰
      - 핸드폰
      - 주소를
      - 이메일

  # A6 — 예측 단정. `08_evaluation_plan.md` §5가 `[정책 확인: 예측 문장 허용 범위]`로
  # 미확정 표기한 항목이라 **보수적으로 차단**한다. 허용 범위가 정해지면 이 묶음을 다시 연다.
  - reason: evidence_missing
    patterns:
      - 확정적으로
      - 반드시 오를
      - 오를 거라고
      - 올라갈 거라고
      - 장담
      - 보장한다고
      - 틀림없이

  # 초안과 무관한 요청(잡담·타 학생 건). 좁게 잡는다 — 스타일 지시를 잘못 삼키면
  # 강사가 정당한 다듬기를 못 하게 된다(과차단이 미차단만큼 나쁘다).
  - reason: out_of_scope
    patterns:
      - 다른 학생 초안
      - 이 학생 말고
      - 농담
      - 오늘 날씨
