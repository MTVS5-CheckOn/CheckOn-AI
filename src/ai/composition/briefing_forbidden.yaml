# 브리핑(강사向) 왜곡 게이트 금칙어 — **원본은 docs/part_a/05_tone_mapping.md §4 A군(forbidden)**.
#
# 이 파일은 그 목록의 복사본이다(발명 아님 — 05 §4가 정본). 강사向 브리핑에도 낙인·비교
# 금지는 동일 적용한다(score를 화면에서 숨기는 것과 같은 정신 — 09 §3·§5 낙인 방지).
#
# ⚠ 유지보수: D-③(tone_map·buffer_lexicon 실파일화) 때 **단일 파일 참조로 전환**한다
#    (buffer_lexicon.yaml forbidden을 직접 읽도록) — 목록이 두 곳에서 따로 늙는 것 방지(99 15-ⓒ).

# A군 — 금칙(치환 불가, 문장 재생성): 낙인·평가·진단·비교
forbidden:
  - 게으르
  - 불성실
  - 산만하
  - 머리가 나쁘
  - 노력을 안
  - 의지가 없
  - 문제아
  - 뒤처졌
  - 꼴찌
  - 최하위
  - 포기한 것 같
  - 집중력이 없      # '오늘 집중이 어려웠다'(상태)는 허용 — 기질 단정만 금지
  - ADHD            # 진단성 표현 일절 금지
  - 우울증
  - 심리적 문제
  - 다른 아이들은    # 비교 프레임
  - 반에서 유일하게
  - 이대로면 큰일    # 공포 유발
  - 가망이 없
  - 손을 놓
