# 게이트 사유 코드 → 다음 시도 수정 지시 문구 (05 §6-2 정본)
#
# 재생성 루프가 직전 게이트 사유를 이 표로 문구화해 다음 시도 프롬프트에 넣는다.
# 매핑은 결정론이며 LLM을 쓰지 않는다(불변식 1). 문구를 코드·프롬프트에 박지 않는다
# (03_coding_rules §1 — "값이 바뀌면 코드 diff가 생기면 위치가 틀린 것").
#
# 키 = 사유 코드의 **접두**(콜론 앞). 콜론 뒤 가변부는 detail_suffix로 덧붙는다.
# ⚠ 게이트가 내는 코드 전수가 여기 있어야 한다 — 미등재는 조용히 default로 퇴화해
#   "지시 없음"과 구분되지 않는다. CI가 두 게이트 소스에서 코드를 추출해 대조한다
#   (tests/ai/contract/test_gate_feedback_coverage.py).
version: "0.1"

instructions:
  # ── counsel 게이트(composition/counsel/gate.py) ──
  empty: "직전 시도가 빈 응답이었습니다. 이번에는 본문을 반드시 작성하세요."
  too_long: "직전 시도가 길이 상한을 넘었습니다. 지정된 문단당 문장 수를 지켜 더 짧게 쓰세요."
  token_leak: "직전 시도에 특수 괄호 ⟪ ⟫ 가 남아 있었습니다. 그 기호를 쓰지 마세요."
  symbol: "직전 시도에 허용되지 않는 특수 기호가 있었습니다. 한글과 일반 문장부호만 쓰세요."
  forbidden: "직전 시도에 쓰면 안 되는 표현이 있었습니다. 낙인·평가·진단 표현 대신 관찰·상태 서술로 바꾸세요."
  ungrounded_number: "직전 시도에 근거에 없는 숫자가 있었습니다. 위 근거에 제시된 수치만 쓰고, 없으면 숫자 없이 상태만 전하세요."
  internal_term: "직전 시도에 이 지시문의 표현이나 내부 절차 이름이 그대로 들어갔습니다. 학부모에게 바로 보낼 문장만 쓰고, 위 안내 문구를 옮겨 적지 마세요."

  # ── 브리핑 게이트(composition/briefing_gate.py) ──
  # 위 counsel 게이트와 같은 의미인데 이름이 다른 코드다. 이름 통일은 관측 라벨
  # 호환성이 걸려 별건이라, 여기서는 두 철자를 모두 등재한다(05 §6-2).
  number_not_grounded: "직전 시도에 근거에 없는 숫자가 있었습니다. 위 근거 데이터에 있는 값만 그대로 쓰고, 없으면 숫자 없이 상태만 전하세요."

#: 등재되지 않은 코드의 안전망. CI 대조가 있어 정상 운영에서는 쓰이지 않는다 —
#: 그래도 문구를 비워 두지 않는다(빈 지시 = 1회차와 동일 프롬프트 = ㉙ 결함 부활).
default: "직전 시도가 검수를 통과하지 못했습니다. 위 작성 규칙을 처음부터 다시 지켜 주세요."

#: 사유 코드의 콜론 뒤 가변부(`forbidden:게으르`의 `게으르`)를 덧붙이는 꼬리말.
#: 코드마다 detail 유무가 달라(예: too_long은 counsel엔 있고 브리핑엔 없다) 문구를
#: 코드별로 쪼개지 않고 한 규칙으로 처리한다.
detail_suffix: " (직전 시도에서 문제가 된 부분: {detail})"
