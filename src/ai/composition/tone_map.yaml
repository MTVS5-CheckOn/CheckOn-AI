# ── §3 하위 백분위 완곡 규칙 (리포트 chart_analysis 전용) ──────
# 소비처가 상담팩이 아니라 리포트다. 수치는 사실대로(변조·은폐 금지) — 문장 프레임만 제어한다.
# 구간 표기는 §3 원문(≥50 / 30~49 / <30)을 정수 백분위 기준 min·max 로 옮긴 것이다.
percentile_softening:
  bands:
    - id: high
      min_percentile: 50
      max_percentile: 100
      requires_pairing: false
      standalone_sentence_allowed: true
      rule: "제한 없음"
    - id: mid
      min_percentile: 30
      max_percentile: 49
      requires_pairing: true
      standalone_sentence_allowed: true
      rule: "반드시 개선 추이 또는 강점 영역과 병기"
    - id: low
      min_percentile: 0
      max_percentile: 29
      requires_pairing: true
      standalone_sentence_allowed: false
      next_plan_adjacent: true
      rule: "병기 의무 + 단독 문장 금지 + 다음 계획 문장 직결"
  anxious_overrides:
    # sensitivity=anxious 이면 각 구간을 한 단계씩 엄격 적용한다.
    stricter_by_one_band: true
    pairing_recommended_from_percentile: 50   # 50~69도 병기 권장
    defer_percentile_block_after_suggestion: true   # 백분위 해설 블록을 제안 블록 뒤로 후치
  notes:
    - "수치는 사실대로 — 변조·은폐 금지. 문장 프레임만 제어한다."
    - "반 평균·석차는 입력에 없다(audience 필터가 선차단) — 이 규칙표는 표현만 다룬다."
