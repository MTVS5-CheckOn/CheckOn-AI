# 완충 사전 — 정본: docs/part_a/05_tone_mapping.md §4 (금칙·치환 50항)
#
# 이 yaml이 런타임 원본이다(코드에 어휘 하드코딩 금지 — 03_coding_rules §1).
# A군 = 금칙(치환 불가 · 문장 재생성) · B군 = 치환(단정 → 관찰·상태 서술).
# ⚠ A군 검출: 05 §5는 **형태소 접두 매칭(활용형 대응)**으로 규정하지만 현 구현은
#   **부분 문자열 포함**이다 — 브리핑 게이트 동작 무변경 유지(99 D ⑰).
#   🔴 아래 A군 중 **어간 끝 음절에 종성이 없는 8항**(게으르·산만하·머리가 나쁘·문제아·
#   꼴찌·최하위·심리적 문제·반에서 유일하게)은 종성이 결합한 활용형이 전부 미탐이다
#   ('게으른'·'게으름'·'산만한'·'머리가 나쁜'). 르·하 불규칙은 그중 한 사례일 뿐이다.
#   범위·해소안 판단은 **99 D ⑰이 정본**이며 어휘를 여기서 임의로 늘리지 마라
#   (05 §4 개정 + 항 수 fail-closed 테스트가 함께 움직인다).
# 적용 단계(§4): 완충 0 = A군만 / 1 = A군 + B군 기본 / 2(anxious) = A군 + B군 전체 + 부정문 후치.
# 소유: A 단독(02_ownership §5). 갱신도 골든 통과가 머지 조건(§5-5).
# 브리핑 왜곡 게이트(briefing_gate.py)도 이 파일의 forbidden 을 직접 읽는다(99 #15 ⓒ 단일화).

version: "0.1"

# A군 — 금칙(치환 불가, 문장 재생성): 낙인·평가·진단
forbidden:
  - 게으르
  - 불성실
  - 산만하
  - 머리가 나쁘
  - 노력을 안
  - 의지가 없
  - 문제아
  - 뒤처졌
  - 꼴찌
  - 최하위
  - 포기한 것 같
  - 집중력이 없           # '오늘 집중이 어려웠다'(상태)는 허용 — 기질 단정만 금지
  - ADHD                  # 진단성 표현 일절 금지
  - 우울증
  - 심리적 문제
  - 다른 아이들은          # 비교 프레임
  - 반에서 유일하게
  - 이대로면 큰일          # 공포 유발
  - 가망이 없
  - 손을 놓

# B군 — 치환(단정 → 관찰·상태 서술)
replace:
  - { from: "못합니다",          to: "아직 익숙하지 않습니다" }
  - { from: "틀렸습니다",        to: "정답에 이르지 못했습니다" }
  - { from: "실패했습니다",      to: "이번에는 결과가 나오지 않았습니다" }
  - { from: "떨어졌습니다",      to: "다소 주춤했습니다" }          # anxious 2단계에서만, data 라벨은 수치 병기
  - { from: "심각합니다",        to: "주의 깊게 보고 있습니다" }
  - { from: "약점입니다",        to: "보완하면 좋을 부분입니다" }
  - { from: "느립니다",          to: "시간을 들여 풀고 있습니다" }
  - { from: "안 했습니다",       to: "이번에는 하지 못했습니다" }
  - { from: "거부합니다",        to: "부담을 느끼는 듯합니다" }
  - { from: "최악",              to: "가장 어려웠던" }
  - { from: "항상 틀립니다",     to: "반복적으로 어려워하는 유형입니다" }
  - { from: "전혀 이해하지 못",   to: "아직 개념이 자리 잡히지 않" }
  - { from: "성적이 나쁩니다",   to: "점수가 기대에 미치지 못했습니다" }
  - { from: "불안정합니다",      to: "편차가 있는 편입니다" }
  - { from: "문제가 있습니다",   to: "함께 살펴볼 부분이 있습니다" }
  - { from: "제출을 안 합니다",  to: "제출이 어려운 주가 있었습니다" }
  - { from: "수업을 안 듣",      to: "수업 참여가 줄어든" }
  - { from: "게을리",            to: "우선순위가 밀린 듯" }
  - { from: "포기",              to: "잠시 멈춘" }
  - { from: "형편없",            to: "아쉬운" }
  - { from: "뒤떨어",            to: "따라잡는 중" }
  - { from: "못 따라",           to: "적응하는 중" }
  - { from: "낙제",              to: "기준 미달" }                  # 사실 서술 필요시 수치로 대체 권장
  - { from: "걱정입니다",        to: "관심 있게 지켜보고 있습니다" }
  - { from: "이해력이 부족",     to: "추론 단계에서 시간이 걸리는" }
  - { from: "기초가 없",         to: "기초를 다지는 단계" }
  - { from: "태도가 나쁘",       to: "컨디션 기복이 보이" }
  - { from: "혼자만",            to: "" }                          # 비교 함의 삭제
  - { from: "반 평균보다",       to: "" }                          # 학부모向 원천 금지(입력에도 없음 — 이중 방어)
  - { from: "다른 학생에 비해",  to: "지난달과 비교해" }            # 비교축을 타인→본인 과거로 전환
