# 완충 사전 — 정본: docs/part_a/05_tone_mapping.md §4 (금칙·치환 53항 — A군 23 · B군 30)
#
# 이 yaml이 런타임 원본이다(코드에 어휘 하드코딩 금지 — 03_coding_rules §1).
# A군 = 금칙(치환 불가 · 문장 재생성) · B군 = 치환(단정 → 관찰·상태 서술).
# A군 검출(99 D ⑰ 해소 · 8/5): **어간만 적는다.** 활용형은 코드가 처리한다 —
#   어간 끝 음절에 종성이 없으면 -ㄴ·-ㄹ·-ㅁ·-ㅂ·-ㅆ를 결합해 함께 본다
#   ('게으르' → '게으른'·'게으름'·'게으릅니다'). 접두 매칭은 하지 않는다(오탐).
#   코드로 만들 수 없는 **불규칙 활용만** 아래에 어간으로 등재했다(3항).
# ⚠ 어휘를 임의로 늘리지 마라 — 05 §4 개정 + 항 수 fail-closed 테스트가 함께 움직인다.
# 적용 단계(§4): 완충 0 = A군만 / 1 = A군 + B군 기본 / 2(anxious) = A군 + B군 전체 + 부정문 후치.
# 소유: A 단독(02_ownership §5). 갱신도 골든 통과가 머지 조건(§5-5).
# 브리핑 왜곡 게이트(briefing_gate.py)도 이 파일의 forbidden 을 읽고 **판정까지**
# buffer_lexicon.find_forbidden에 위임한다 — 어휘·판정 모두 단일 참조(99 #15 ⓒ · D ⑰).

version: "0.1"

# A군 — 금칙(치환 불가, 문장 재생성): 낙인·평가·진단
forbidden:
  - 게으르
  - 불성실
  - 산만하
  - 머리가 나쁘
  - 노력을 안
  - 의지가 없
  - 문제아
  - 뒤처졌
  - 꼴찌
  - 최하위
  - 포기한 것 같
  - 집중력이 없           # '오늘 집중이 어려웠다'(상태)는 허용 — 기질 단정만 금지
  - ADHD                  # 진단성 표현 일절 금지
  - 우울증
  - 심리적 문제
  - 다른 아이들은          # 비교 프레임
  - 반에서 유일하게
  # ── 🔴 B군에서 옮겨 온 2항 (8/19 · 분류 오류 정정) ────────────
  # **B군이 아니었다.** 이 파일 머리말이 A군 = 금칙(치환 불가) · B군 = 치환으로 정의하는데
  # 이 둘은 `to`가 **빈 문자열**이었다 — 치환할 대상이 없으니 치환군이 아니다.
  # (yaml 주석도 "비교 함의 삭제"·"학부모向 원천 금지"라 적었다. **삭제는 치환이 아니다.**)
  # 🔴 그 사이 B군은 소비처가 0곳이라 이 둘이 **아무 데서도 안 막혔다** — 불변식 7의
  #   출력측 방어가 `다른 아이들은`·`반에서 유일하게` **2항뿐**이었다. 이동으로 4항이 된다.
  # ⚠ 항 수는 안 바뀐다 — 53 고정(A군 23→25 · B군 30→28).
  # ⚠ 문맥을 안 보므로 "혼자만의 속도로 꾸준히" 같은 정상 문장도 걸린다. **그 비용은
  #   이 파일이 이미 수용한 것이다** — 위 `산만하` 항의 판단과 같다: A군은 치환 불가·문장
  #   재생성이라 LLM이 다시 쓰면 되고, 문맥 판정을 넣으면 결정론 게이트가 아니게 된다(불변식 1).
  # ⚠ `conjugating`에 넣지 않는다 — 구·명사구라 종성 결합 대상이 아니다(넣으면 오탐만 는다).
  - 혼자만
  - 반 평균보다
  - 이대로면 큰일          # 공포 유발
  - 가망이 없
  - 손을 놓
  # ── 불규칙 활용 3항 (8/5 · 99 D ⑰ 해소) ──────────────────────
  # 종성 결합(-ㄴ·-ㄹ·-ㅁ·-ㅂ·-ㅆ)은 코드가 기계적으로 처리하지만, **어간 자체가
  # 변형되는 불규칙**은 코드로 만들 수 없어 어간으로 등재한다. 대상은 A군 중
  # **활용이 있는 어간 3개뿐**이다 — 나머지 5항(문제아·꼴찌·최하위·심리적 문제·
  # 반에서 유일하게)은 명사라 활용이 없다. 이 3항도 종성 결합을 함께 타므로
  # '산만해' 하나로 '산만했습니다'까지 걸린다.
  - 게을러                  # 르 불규칙: 게으르 + 어 → 게을러(서)
  - 산만해                  # 여 불규칙: 산만하 + 여 → 산만해(서)
  - 머리가 나빠             # 으 탈락: 머리가 나쁘 + 아 → 머리가 나빠(서)

# 활용하는 어간(용언) — **이 목록에 있는 항목만** 종성 결합을 함께 본다.
#
# 왜 목록이 필요한가: 종성 결합은 '활용'을 흉내 내는 장치인데 **A군의 절반은 명사·구**라
# 활용 자체가 없다. 결합형(`문제안`·`꼴찐`·`최하윈`)은 한국어가 아니라 잡을 대상이 없고,
# 그런데도 부분 문자열이라 **정상 어절을 오탐한다** — `문제아`+ㄴ=`문제안`이
# "문제안내 드립니다"·"문제안을 검토했습니다"를 잡았다(8/5 실측 4문장 · 99 D ⑰).
# ⇒ **얻는 것 0 · 잃는 것만 있는** 결합이라 용언에만 적용한다.
#
# 여기 없는 어간(문제아·꼴찌·최하위·심리적 문제·반에서 유일하게 등)은 어간 그대로만 본다.
# ⚠ 이 목록의 항목은 전부 위 forbidden에 있어야 한다 — 로드 시 fail-closed로 검증한다.
conjugating:
  - 게으르                  # 게으른·게으름·게으릅니다
  - 산만하                  # 산만한·산만함·산만합니다
  - 머리가 나쁘             # 머리가 나쁜·나쁩니다
  - 게을러                  # 게을렀습니다
  - 산만해                  # 산만했습니다
  - 머리가 나빠             # 머리가 나빴습니다

# B군 — 치환(단정 → 관찰·상태 서술)
replace:
# 🔴 `stem`(선택) — **관측 전용 어간**이다. 프롬프트는 `from` 만 쓴다(한 줄도 안 바뀐다).
#
# **왜 필요한가(99 #84):** `observe_gated_draft` 가 `from` 으로 초안을 세는데, B군 28항 중
# **15항이 종결형**(`~니다`)이라 다른 활용형은 표면이 달라 **안 잡힌다** ⇒ 계수가 **하한**이고,
# 그 숫자가 게이트 판정(#79)의 유일한 재료라 «빈도가 낮으니 안전하다» 로 **틀린 방향으로
# 기운다.** ⚠ 원인은 종성 결합이 아니다 — `find_forbidden` 은 **부분 문자열**이라 어간으로
# 등재된 13항은 활용형을 이미 잡는다. 🔴 `conjugating` 에 B군을 넣어 고치지 마라
# (로더 규약 `conjugating ⊆ forbidden` 이 깨지고, 그 길로는 안 고쳐진다).
#
# **왜 `from` 을 안 낮추나:** `from` 은 프롬프트가 쓰는 자연문이다 —
# *"「심각합니다」 대신 「…」로 쓰세요"* 가 *"「심각하」 대신"* 이 되면 문장이 아니다.
# ⇒ 용도가 둘이라 **필드를 둘로 가른다.** 항 수·문면이 안 바뀌므로 05 §4 개정도,
# 항 수 fail-closed(53)도, #83 의 `redact()` 오탐 축도 **따라오지 않는다.**
#
# 🔴 **관측은 `from` **과** `stem` 을 둘 다 본다** — `or` 가 아니다.
#    좁힌 어간이 원본을 포함하지 않는 경우가 있어서다(`못한` ⊄ `못합니다`).
#
# ⚠ **`stem` 이 없는 항이 있는 것이 정상이다** — 어간·구 13항은 이미 맞고,
#    종결형 3항은 **낮추면 정상 문장을 오탐**해서 일부러 안 줬다(각 항 위 주석).
#    **그 3항이 계수의 남은 하한이다.**
  - { from: "못합니다",          to: "아직 익숙하지 않습니다", stem: "못한" }
  # 🔴 stem 없음(보류 · 99 #84) — 틀린 → "틀린 문제를 다시 정리했습니다"(정상)를 잡는다
  - { from: "틀렸습니다",        to: "정답에 이르지 못했습니다" }
  - { from: "실패했습니다",      to: "이번에는 결과가 나오지 않았습니다", stem: "실패한" }
  - { from: "떨어졌습니다",      to: "다소 주춤했습니다", stem: "떨어진" }          # anxious 2단계에서만, data 라벨은 수치 병기
  - { from: "심각합니다",        to: "주의 깊게 보고 있습니다", stem: "심각한" }
  - { from: "약점입니다",        to: "보완하면 좋을 부분입니다", stem: "약점이" }
  # 🔴 stem 없음(보류 · 99 #84) — 느린 → "느린 호흡으로 꼼꼼히 봅니다"(정상)를 잡는다
  - { from: "느립니다",          to: "시간을 들여 풀고 있습니다" }
  # 🔴 stem 없음(보류 · 99 #84) — 안 한 → "안 한 것은 없습니다"(정상)를 잡는다
  - { from: "안 했습니다",       to: "이번에는 하지 못했습니다" }
  - { from: "거부합니다",        to: "부담을 느끼는 듯합니다", stem: "거부한" }
  - { from: "최악",              to: "가장 어려웠던" }
  - { from: "항상 틀립니다",     to: "반복적으로 어려워하는 유형입니다", stem: "항상 틀리" }
  - { from: "전혀 이해하지 못",   to: "아직 개념이 자리 잡히지 않" }
  - { from: "성적이 나쁩니다",   to: "점수가 기대에 미치지 못했습니다", stem: "성적이 나쁜" }
  - { from: "불안정합니다",      to: "편차가 있는 편입니다", stem: "불안정" }
  - { from: "문제가 있습니다",   to: "함께 살펴볼 부분이 있습니다", stem: "문제가 있" }
  - { from: "제출을 안 합니다",  to: "제출이 어려운 주가 있었습니다", stem: "제출을 안 하" }
  - { from: "수업을 안 듣",      to: "수업 참여가 줄어든" }
  - { from: "게을리",            to: "우선순위가 밀린 듯" }
  - { from: "포기",              to: "잠시 멈춘" }
  - { from: "형편없",            to: "아쉬운" }
  - { from: "뒤떨어",            to: "따라잡는 중" }
  - { from: "못 따라",           to: "적응하는 중" }
  - { from: "낙제",              to: "기준 미달" }                  # 사실 서술 필요시 수치로 대체 권장
  - { from: "걱정입니다",        to: "관심 있게 지켜보고 있습니다", stem: "걱정되" }
  - { from: "이해력이 부족",     to: "추론 단계에서 시간이 걸리는" }
  - { from: "기초가 없",         to: "기초를 다지는 단계" }
  - { from: "태도가 나쁘",       to: "컨디션 기복이 보이" }
  # 🔴 `혼자만`·`반 평균보다`는 8/19에 **A군으로 옮겼다** — `to`가 비어 치환이 아니었다(위 주석).
  #    되돌리지 마라. 되돌리면 불변식 7의 출력측 방어가 다시 2항이 된다.
  - { from: "다른 학생에 비해",  to: "지난달과 비교해" }            # 비교축을 타인→본인 과거로 전환 · **실제 치환이라 B군이 맞다**
