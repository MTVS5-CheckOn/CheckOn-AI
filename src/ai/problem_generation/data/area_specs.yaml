# 영역별 출제 규격 — M2 문항 생성 프롬프트가 조립해 쓴다.
#
# 🔴 **왜 이 파일이 생겼나.** 종전 `items.txt`는 area_tag를 *"요청 값 그대로 보존한다"* 고만
# 지시했다. 그러면 모델은 **그 영역이 무엇을 묻는 영역인지를 모른 채** 문항을 만든다 —
# 실제로 나오는 것은 영역과 무관하게 비슷한 「지문 읽고 고르기」다. 수능 국어는 영역마다
# 발문·자료·선지의 형태가 다르고, 그 차이가 곧 문항의 값이다.
#
# ⚠ **규칙을 프롬프트에 하드코딩하지 않는다**(CLAUDE.md §6 — 규칙=yaml). 영역이 늘거나
# 규격이 바뀌면 코드 diff가 아니라 이 파일 diff가 나야 한다.
# ⚠ **`AreaTag` 전 항목을 덮어야 한다** — 누락은 `KeyError`가 아니라 **규격 없는 생성**으로
# 조용히 빠진다. `test_area_specs.py`가 전수 대조로 막는다.
#
# label_ko  강사 화면·출제 프롬프트가 쓰는 **정식 라벨**(정본).
#           ⚠ R6 브리핑의 짧은 라벨(`briefing_context._AREA_KO`)과 다른 축이다 —
#             그쪽은 `"영역·유형"` 조립이라 두 글자여야 한다.
# measures  그 영역이 **무엇을 측정하는가** — 발문이 향할 대상.
# stem_forms  수능 발문 정형. 모델이 스스로 발문 틀을 만들면 모의고사처럼 안 읽힌다.
# distractors 그 영역에서 **매력적 오답이 만들어지는 방식**. 이게 없으면 오답이 명백히
#             틀린 문장이 되어 변별력이 0이 된다.
# avoid     그 영역에서 반복적으로 나오는 실패 형태.

schema_version: area-specs.v1

areas:
  language:
    label_ko: 언어
    measures: 국어 규칙(음운·단어·문장·담화·국어사)의 이해와 적용
    stem_forms:
      - "<보기>를 바탕으로 ㉠~㉤을 이해한 내용으로 가장 적절한 것은?"
      - "다음은 국어사 자료에 대한 탐구이다. ⓐ~ⓔ에 대한 설명으로 적절한 것은?"
      - "밑줄 친 부분의 음운 변동에 대한 설명으로 적절한 것은?"
    distractors: |
      규칙은 맞게 적었으나 **적용 대상 단어를 바꾼** 선지, 변동의 **종류를 인접한 것으로
      바꾼** 선지(교체↔탈락·축약↔첨가), 순서를 뒤바꾼 선지.
      형태소에서는 **어근과 접사의 경계를 잘못 나눈** 선지, **파생접사와 굴절접사,
      접두와 접미를 뒤바꾼** 선지, **합성·파생·단일어를 서로 잘못 판정한** 선지.
      문장에서는 **주어·목적어·보어·부사어를 혼동한** 선지, **명사절·관형절·부사절·
      서술절·인용절을 혼동한** 선지, **높임·시제·피동·사동·부정 중 다른 범주로 바꾼** 선지.
      담화에서는 **지시·대용 표현이 가리키는 대상을 잘못 연결한** 선지, **발화 상황·전제를
      빼고 문장 단위로만 해석한** 선지. 국어사에서는 **중세·근대 국어의 특징을 서로
      뒤섞은** 선지, **현대 국어 규칙을 옛말 자료에 그대로 적용한** 선지.
    avoid: |
      용어 정의만 묻는 단순 암기 문항. 규칙을 진술만 하고 **자료에 적용시키지 않는** 문항.

  media:
    label_ko: 매체
    measures: 매체 자료의 수용(정보 판단·의도 파악)과 생산(구성·표현 선택)
    stem_forms:
      - "(가)에 대한 이해로 가장 적절한 것은?"
      - "(가)를 바탕으로 (나)를 작성했다고 할 때, ㉠~㉤에 대한 설명으로 가장 적절한 것은?"
      - "다음은 학생이 만든 매체 자료이다. 이에 대한 설명으로 적절한 것은?"
    distractors: |
      매체 **특성과 무관한 일반 독해** 진술, 사용된 표현 수단을 **다른 수단으로 바꾼** 진술,
      수용자 반응을 생산자 의도로 **뒤바꾼** 진술.
    avoid: |
      매체 자료 없이 본문만 읽고 풀리는 문항 — 그건 독서다. 매체 **형식**(댓글·하이퍼링크·
      실시간 채팅 등)이 문항에 실제로 작동해야 한다.

  literature:
    label_ko: 문학
    measures: 작품의 표현·구성·화자(서술자)·정서와 외적 준거를 통한 감상
    stem_forms:
      - "윗글에 대한 설명으로 가장 적절한 것은?"
      - "<보기>를 참고하여 윗글을 감상한 내용으로 가장 적절한 것은?"
      - "㉠~㉤에 대한 이해로 가장 적절한 것은?"
    distractors: |
      작품에 **실재하는 표현을 근거로 삼되 해석을 과장한** 선지, 화자·서술자의 태도를
      **인접 정서로 바꾼** 선지(체념↔달관·연민↔비판), 시점·서술 방식을 바꾼 선지.
    avoid: |
      작가의 생애·문학사 지식을 요구하는 문항(작품 밖 지식). 근거 없는 주제 단정.

  reading:
    label_ko: 독서
    measures: 지문의 정보 확인·추론·비판적 이해와 <보기> 적용
    stem_forms:
      - "윗글의 내용과 일치하는 것은?"
      - "㉠에 대한 이해로 가장 적절한 것은?"
      - "윗글을 바탕으로 <보기>를 이해한 내용으로 가장 적절한 것은?"
    distractors: |
      지문의 문장을 가져오되 **인과·조건·범위 한정어를 바꾼** 선지(모두↔일부·때문에↔불구하고),
      두 단락의 정보를 **잘못 결합한** 선지.
    avoid: |
      지문 밖 배경지식이 있어야 풀리는 문항. 문장 하나를 그대로 옮겨 적은 정답 선지.

  speech_writing:
    label_ko: 화법과작문
    measures: 담화 참여자의 말하기 전략과 글쓰기 계획·자료 활용·고쳐쓰기
    stem_forms:
      - "위 발표에 나타난 말하기 방식으로 가장 적절한 것은?"
      - "다음은 학생의 초고이다. ㉠~㉤을 고쳐 쓴 방안으로 가장 적절한 것은?"
      - "<보기>는 글쓰기를 위해 수집한 자료이다. 자료 활용 방안으로 가장 적절한 것은?"
    distractors: |
      전략의 **이름은 맞으나 해당 발화에 없는** 선지, 고쳐쓰기 방향을 **반대로 제시한** 선지
      (구체화↔일반화), 자료의 성격과 활용 목적이 어긋난 선지.
    avoid: |
      담화·초고 상황이 제시되지 않은 채 원칙만 묻는 문항. 맞춤법 교정만 묻는 문항.
