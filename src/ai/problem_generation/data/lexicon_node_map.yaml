# 표준국어대사전 T1 어휘 근거 노드 map.
#
# 🔴 **왜 표제어를 손으로 적나.** 덤프에는 `cat=언어` sense 가 3,508 표제어에 걸쳐 있고
# 그중 무엇이 **그 노드의 근거로 승인되는가**는 자동으로 정해지지 않는다. R-1 어휘 대조가
# 이 목록을 정본으로 삼으므로, 승인 목록은 사람이 고르고 리뷰한다(fail-closed).
#
# ⚠ **표제어는 덤프 표기 그대로 적을 필요가 없다** — `normalize_headword()` 가 `^`·`-` 와
#   끝 동형이의어 번호를 지우고 비교한다(`의존^명사` = `의존명사` = `의존^명사01`).
# ⚠ **없는 표제어를 적어도 빌드는 안 깨진다** — 조용히 안 걸릴 뿐이다. 노드가 0건이 되면
#   그때 `LexiconIndexBuildError` 가 난다. 목록을 고칠 때는 빌드 후 노드별 건수를 확인한다.
# ⚠ **어문규범 근거 노드(11개)를 여기 넣지 마라** — `test_taxonomy_catalog.py` 가 두 근거
#   모드의 노드 중복을 금지한다. 한 노드의 근거 출처는 하나여야 한다.
#
# version   이 목록의 버전. 바꾸면 올린다 — 색인 `version` 으로 그대로 나가고
#           재현성 축(불변식 8)에 걸린다.
# v3: 22 노드의 표제어를 35 → 110 으로 넓혔다. 종전에는 노드당 1~4 개라 실제 색인 entry
#           가 노드당 중앙값 1 건이었고, 같은 근거로만 문항이 나왔다. `max_evidence_count: 8`
#           이 종전에는 한 번도 닿지 않는 값이었다.
#           🔴 **날짜를 손으로 적지 않는다** — 시점의 정본은 `git log --date=short` 다
#           (`test_recorded_dates_have_passed` 가 손으로 적은 미래 날짜를 문다).

