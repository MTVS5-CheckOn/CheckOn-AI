# M2 T1 파일럿 기본값. 잠정값 변경 시 golden/problems/를 함께 개정한다.
version: verify-config.v1
regen_max: 2
# 생성 자료(지문·담화·매체자료)가 마스킹 불확실일 때 다시 뽑는 횟수 상한.
# 🔴 regen_max(문항 시도 계약 · 2 고정)와 다른 축이라 따로 둔다 — 자료는 세트당 한 번만
# 만들어져서, 여기서 못 거르면 문항을 몇 번 다시 뽑아도 같은 자료가 다시 온다.
# 실측: 지문 1회 차단 확률이 낮지 않다. 3회(=regen_max+1)로는 3연속 차단이 났고,
# 6회(=5+1)로도 독서에서 소진이 관측돼 8로 올렸다(상한은 모델 검증이 10까지 허용).
source_redaction_retry_max: 8
transport_retry: 1
dup_similarity_max: 0.8
# R-8 외부 대조 상한 — 생성 지문의 8자 shingle 중 외부 자료 한 건과 겹치는 비율.
# 실측(2026-08-19 · AI Hub 71857 지문 2,628건 색인): 전재 1.000 · 무관한 한국어 산문
# 73건 전부 0.000. 잡음 바닥이 0이라 0.2는 「상당 분량 전재」만 잡고 인용은 흘린다.
external_similarity_max: 0.2
# 산문 갈래 발췌 창의 길이 경계. 🔴 **문단 하나는 발췌 단위가 아니다** — 실측(2026-08-19)
# 소설 문단 104,259개의 중앙값이 41자이고 78%가 100자 미만이다(대화 한 줄이 한 문단).
# 그대로 고르면 「거짓말을 해?」 9자가 제시문이 된다. 연속 문단을 하한까지 이어 붙인다.
literature_excerpt_min_chars: 600
literature_excerpt_max_chars: 2000
cross_confidence_high: 0.8
alignment_confidence_min: 0.7
set_drop_ratio_max: 0.3
verify_outage_streak_max: 3
t1_light_mode: false
difficulty_regen_enabled: false
difficulty_regen_max: 1
difficulty_band_tolerance: 1
difficulty_band_map:
  T1:
    low:
      min: 1.0
      max: 1.5
    medium:
      min: 2.0
      max: 2.5
    high:
      min: 3.0
      max: 3.5
diag_relative_cut_pp: -15
diag_decay: 0.7
diag_propagate_threshold: 0.5
diag_severity_saturation: 0.30
diag_suspect_damping: 0.5
node_min_items: 6
difficulty_weights:
  base: 1.0
  passage_word_count:
    over_700: 0.5
    over_1000: 1.0
  sentence_complexity:
    advanced: 0.5
  type_tag:
    fact: 0.0
    concept: 0.0
    infer: 0.5
    critic: 1.0
  low_cross_solve_confidence: 0.5
  multiple_evidence: 0.5
