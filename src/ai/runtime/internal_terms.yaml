# 내부 용어 — 학부모 문면에 나오면 안 되는 **구(句)** 목록.
#
# 이 yaml이 런타임 원본이다(코드에 어휘 하드코딩 금지 — 03_coding_rules §1).
# 소유: A 단독(02_ownership §5). `buffer_lexicon.yaml`과 같은 자리·같은 규약이다.
#
# 🔴 **왜 게이트인가.** 프롬프트에 "쓰지 마라"를 적는 것으로는 못 막는다 — LLM이 지시문을
# 되뇌는 건 확률적이다. 금칙어에서 이미 겪었다: 프롬프트에 "게으르다 금지"가 있는데도 실
# LLM이 '게으른'을 냈고 **실제 방어선은 게이트**였다. 템플릿도 함께 고쳤지만(PROMPT_VERSION
# 0.2 — 산출물 이름 제거) 그건 재생성 낭비를 줄이는 것이고, 마지막 방어는 여기다.
#
# 🔴 **단어가 아니라 구로 잡는다.** '상담'은 학부모 문면에 자연스럽다("상담을 드립니다").
# 문제는 '상담 초안' 같은 **내부 산출물 이름**과 지시문 조각이다. 단어로 잡으면
# `문제아` 접두가 "문제 풀이 시간"을 잡던 자리가 그대로 재현된다.
#
# ⚠ 어휘를 늘리기 전에 **실측 초안 전량에 오탐 0**을 확인한다(PR 본문에 결과를 적는다).
# 근거: 2026-08-06 3차 실측 첫 문장이 "2026년 7월 상담 초안을 드립니다." 였다.

version: "0.1"

# 🔴 **등재 근거는 둘뿐이다** — ⓐ 실측 누출 ⓑ 프롬프트에 실제로 있는 문면(섹션 제목·
# 지시문 조각). 프롬프트에 없는 말은 넣지 않는다: LLM이 되뇔 근거가 없는데 목록만 길어지고
# 오탐 위험만 는다. (초안에 '프롬프트'·'게이트'를 넣었다가 이 규칙으로 되돌렸다.)
internal_terms:
  # ⓐ 실측 누출 (2026-08-06 3차 · S2-③ 첫 문장)
  - 상담 초안
  - 초안을 드립니다
  # ⓑ-1 PROMPT_VERSION 0.1 문면 — 템플릿에서 지웠지만 회귀 방어로 남긴다
  - 초안을 작성
  - 작성 규칙
  - 블록 구성
  - 블록당 2문장
  - 블록당 3문장
  - 블록당 4문장
  - 블록당 5문장
  # ⓑ-2 PROMPT_VERSION 0.2 문면 — 지금 프롬프트에 있는 것이라 되뇔 수 있다
  - 안내 글을 씁니다
  - 글의 구성
  - 지켜야 할 것
  - 관찰된 근거
  - 소통 톤
  - 완충 1
  - 완충 2
