# 마스킹·redaction 패턴 — 정본: docs/policies/masking_redaction.md §2
#
# 이 yaml이 패턴 원본이다(코드에 정규식 하드코딩 금지 — §6: 코드 배포 없이 갱신).
# 갱신도 golden/redaction 코퍼스 통과가 머지 조건. 소유: A 단독(02_ownership §5).
# 정규식은 §2 표의 표기 그대로. YAML 단일따옴표는 백슬래시를 보존한다.

version: "0.1"

# ── 토큰 유형명 (§1: ⟪유형N⟫) ────────────────────────────────
tokens:
  name: "이름"
  phone: "연락처"
  email: "이메일"
  address: "주소"
  school: "학교"
  birth: "생년월일"
  student_id: "학번"
  uncertain: "확인필요"   # 번호 없음 — 판단 불가 표식

# ── 정규식 일괄 (P2~P7) — 순서대로 적용 ──────────────────────
# 각 항목: type(토큰 유형 키) · patterns(정규식 목록, OR)
regex_batch:
  # P6_rrn(주민번호)을 P2(전화)보다 먼저 — 주민번호 앞자리가 전화로 부분 매칭되는 것 방지.
  - id: P6_rrn
    type: birth
    patterns:
      - '\d{6}[-\s]?[1-4]\d{6}'
  - id: P2_phone
    type: phone
    patterns:
      - '01[016789][-.\s]?\d{3,4}[-.\s]?\d{4}'
      - '0\d{1,2}[-.\s]?\d{3,4}[-.\s]?\d{4}'
  - id: P3_email
    type: email
    patterns:
      - '[\w.+-]+@[\w-]+\.[\w.]+'
  - id: P6_birth
    type: birth
    # 생년월일 — 문맥 단어(생·출생)가 가까울 때만 마스킹(시험 날짜 오탐 방지, §2 P6)
    context_required: true
    context_words: ["생", "출생"]
    patterns:
      - '(19|20)\d{2}[./년\s]\s?\d{1,2}[./월\s]\s?\d{1,2}'
  - id: P7_student_id
    type: student_id
    patterns:
      - '(학번|수험번호|원번)\s?[:\s]?\d{4,}'
  - id: P4_address
    type: address
    patterns:
      - '(시|도)\s?[가-힣]+(구|군)\s?[가-힣0-9]+(동|로|길)(\s?\d+(동|호|번지))*'
  - id: P4_address_dong
    type: address
    # 동 단위만 노출된 경우(§2 P4 [제안 — 과잉 감수] → [A 확정 7/23]): 동 지명만 마스킹.
    # 흔한 '~동' 명사(행동·운동…) 오탐은 화이트리스트로 제외 — 코퍼스와 함께 누적(§6).
    whitelist: address_dong_exclude
    # (?!아리|네|생…): '동'으로 시작하는 복합어(동아리·동네·동생)의 '동'을 주소로 오탐 방지.
    patterns:
      - '[가-힣]{2,3}동(?!아리|네|생|창|기|료|일|시|화)(?=\s|$|[가-힣])'
  - id: P5_school_full
    type: school
    patterns:
      - '[가-힣]{2,10}(초등학교|중학교|고등학교|여자중|여자고|외고|과학고|국제고|예고)'
  - id: P5_school_abbr
    type: school
    # 축약형(OO중·OO고) — 화이트리스트 + 학교 문맥 게이팅(동사 어미 -고/-중 오탐 방지).
    # 문맥어가 근처에 없으면 마스킹 안 함("그만두고" 등 흔한 어미 제외).
    whitelist: school_abbr_exclude
    context_words: ["학년", "재학", "졸업", "전학", "입학", "다녀", "다녔", "합격", "붙었"]
    patterns:
      - '[가-힣]{2,6}(초|중|고)\b'

# ── P1ⓑ 통계 인명 검출 (명부 P1ⓐ는 백엔드 1차 — 범위 밖) ──────
# 호칭 결합형은 confident → ⟪이름N⟫. §2 P1ⓑ 표의 정규식 그대로.
name_honorific:
  type: name
  # 🔴 (8/6) **두 갈래로 나눴다** — 호칭어의 신호 강도가 다르기 때문이다.
  #
  #   ① 긴 호칭(어머니·아버님·학생·쌤·선생님): 그 자체로 강한 호칭 신호라 앞 어절이
  #      2~3자 한글이면 족하다. "서연 어머니"(성 생략)를 잡으려면 이 폭이 필요하다.
  #   ② 관계어·1자 호칭(엄마·아빠·형·군·양…): **일반 문맥에 흔하다.** 앞이 이름이라는
  #      추가 신호가 없으면 "우리 엄마"·"숙제 양이"·"대조군"이 통째로 마스킹된다.
  #      그래서 앞을 **정식 성명(성씨 + 이름 2자)** 으로 묶는다.
  #
  # 🔴 종전에는 관계어가 **별명형 패턴에만** 배선돼 있었다(`서연이 엄마`). 정식 성명 3자
  #   앞에는 없어서 `박서연 엄마입니다`가 실명 그대로 나갔다 — 실측 **14종 전건 미탐**
  #   (엄마·아빠·아버지·할머니·할아버지·누나·형·언니·오빠·이모·삼촌·보호자·부모·학부모).
  #   ⚠ `어머니`·`어머님`·`아버님`은 있는데 **`아버지`가 없었다** — 목록이 체계 없이
  #   만들어졌다는 증거이고, 그게 커버리지 매트릭스를 도입한 근거다(99 ㉯).
  #
  # 🔴 ②가 `$surnames`를 쓰는 근거는 실측이다(8/6 · 네 안 비교):
  #      현행(제약 없음)  오탐 9 · 미탐 0
  #      ⓐ 공백 필수      오탐 7 · 미탐 1
  #      ⓒ 양·군 제거     오탐 0 · 미탐 3   ← 오탐을 미탐으로 옮기는 안
  #      ⓑ 성씨 결합      오탐 0 · 미탐 0   ← 채택
  #   ⚠ ⓑ를 **①에도 걸면 안 된다** — `서연 어머니`(성 생략 2자)가 미탐이 된다.
  #      오탐을 줄이려다 미탐을 만드는 자리라 축을 갈랐다.
  #
  # 학생(?!들): "학생들"(복수 일반명사) 오탐 방지 — 호칭 '학생'만.
  patterns:
    - '([가-힣]{2,3})(\s?(어머니|아버님|어머님|학생(?!들)|쌤|선생님))'
    #   ⚠ `(?<!이)`: **별명형은 이 갈래가 가로채지 않는다.** `서연이 엄마`는 `서`가 성씨라
    #   우연히 매치되는데, 별명(성 생략)은 명부 없이 이름 확정이 불가라 `⟪확인필요⟫`
    #   (fail-closed)가 정답이다 — 여기서 잡으면 `⟪이름1⟫`으로 **얻지 않은 확신**을 낸다.
    #   골든 28이 그걸 잡았다. 별명형은 아래 `scoring`의 관계어 패턴이 처리한다.
    - '([$surnames][가-힣]{2})(?<!이)(\s?(할아버지|할머니|아버지|학부모|보호자|삼촌|엄마|아빠|누나|언니|오빠|이모|부모|형|군|양))'
  # 🔴 (8/5) 그룹1이 **호칭어 자신**이면 치환하지 않는다.
  #   "⟪이름1⟫ 학생 어머니입니다"에서 그룹1로 `학생`이 잡혀 호칭이 이름으로 마스킹되고,
  #   그 잔여가 다시 인명 후보가 돼 트립와이어가 전송을 막았다(불필요한 폴백).
  #   코드가 정규식을 파싱하지 않도록 목록을 여기 따로 둔다(§6).
  # 🔴 (8/6 정정) 비교는 **조사를 벗기고** 한다 — 종전 정확 일치라 `학생의`·`학생을`처럼
  #   조사가 붙으면 목록에 없어 우회했다. "○○ 학생의 어머니입니다"는 학부모 문의의
  #   전형 문면이라 실제로 터졌다. 조사 목록은 위 `particles.korean`이 정본이다.
  #   ⚠ `startswith` 비교는 쓰지 않는다 — `학생회`까지 스킵돼 **미탐 방향**으로 샌다.
  # ⚠ ⓛ의 교훈 — `patterns`와 `words`가 갈리면 조사 결합형이 우회한다. 위 정규식에 넣은
  #   호칭어는 **여기에도 전부** 넣는다(그룹1이 호칭어 자신일 때 치환을 막는 목록).
  words:
    - 어머니
    - 아버님
    - 어머님
    - 학생
    - 선생님
    - 쌤
    - 군
    - 양
    # ── (8/6) 관계어 추가분 — 위 패턴 ②와 같은 목록이어야 한다 ──
    - 할아버지
    - 할머니
    - 아버지
    - 학부모
    - 보호자
    - 삼촌
    - 엄마
    - 아빠
    - 누나
    - 언니
    - 오빠
    - 이모
    - 부모
    - 형

# ── P8 우회 표기 (한글숫자 디코딩 + 재적용 · [A 확정 7/23]) ────
bypass:
  # 공백·특수문자·한글숫자가 섞인 연락처 후보 스캔용
  candidate: '[0-9공영일이삼사오육칠팔구빵][0-9공영일이삼사오육칠팔구빵\s.\-]{7,}[0-9공영일이삼사오육칠팔구빵]'
  # 디코딩 전 제거할 구분자(공백·점·하이픈) — 코드에 정규식 하드코딩 금지(§6)
  separators: '[\s.\-]'
  korean_digits:
    "공": "0"
    "영": "0"
    "빵": "0"
    "일": "1"
    "이": "2"
    "삼": "3"
    "사": "4"
    "오": "5"
    "육": "6"
    "륙": "6"
    "칠": "7"
    "팔": "8"
    "구": "9"
  # 디코딩 후에도 P2 미검출인 연락처 문맥의 잔여 한글숫자열 → ⟪확인필요⟫ 폴백
  residual_hangul_digits: '[공영일이삼사오육칠팔구빵]{3,}'
  contact_context: ["번호", "전화", "연락", "폰", "핸드폰"]

# ── 잔여 위험 스코어링 (밀도 ≥2 → 문장 통째 · [A 확정 7/23]) ───
# 미확정 인명 후보: 명부·호칭·화이트리스트로 확정 안 된 이름꼴 + 조사.
# 🔴 (8/6 신설) 조사 목록 — **정본은 여기 한 곳**이다.
#   두 소비자가 같은 목록을 쓴다: ① `scoring.name_candidates`의 `$particles_*` 조립
#   ② `name_honorific`의 호칭어 필터가 조사를 벗기고 비교할 때(`학생의` → `학생`).
#   종전에는 조사가 정규식 문자열 안에만 있어 호칭어 필터가 **정확 일치**로 비교했고,
#   `학생의`처럼 조사가 붙으면 목록에 없어 우회했다(8/6 해소).
#   코드는 목록을 문자 클래스로 잇는 일만 한다 — 정규식을 파싱하지 않는다(§6).
particles:
  korean:
    [이, 가, 은, 는, 을, 를, 의, 와, 과, 도, 랑, 한테, 에게, 께, 네]
  # ⚠ 라틴 문자 이름의 조사는 **넓히지 않는다** — `의`·`을`·`과`를 더하면
  #   `ProblemPack의`·`Pack을` 같은 도메인 용어가 걸린다(8/5 실측).
  latin: [이, 가, 는, 를, 도, 랑, 한테, 에게]

scoring:
  # 한글 성명 + 유음 '이' + 조사 (서연이가·민준이한테) — 별명·성 생략 포함.
  # 그룹1 = 치환 대상(이름+이 / 영문명), 그룹2 = 조사 또는 관계어(유지, lookahead).
  #
  # 🔴 (8/5 구현 정정) 조사 목록에 주격 '이'·보조사 '은'·목적격 '을'·관형격 '의'·
  #   공동격 '와/과'가 **빠져 있었다**. `masking_redaction`:40의 스펙은 "2~3자 한글 +
  #   조사 결합"인데 구현이 그보다 좁았다 — 스펙 갭이 아니라 구현 갭이다.
  #   (8/6) 목록 실물은 위 `particles`로 옮겼다 — `$particles_korean`이 조립된다.
  name_candidates:
    - '([가-힣]{2,3}이)($particles_korean)'
    - '([A-Z][a-z]+)($particles_latin)'   # 영문명 + 조사 (Sarah가)
    # 이름+이 + 관계어(엄마·아빠·형제) — "서연이 엄마한테"의 서연 검출(이름 위치 신호)
    # 🔴 (8/6) 관계어 목록을 **호칭 갈래와 같게** 맞췄다. 종전엔 8종뿐이라
    #   `서연이 아버지`·`서연이 보호자`·`서연이 이모`가 미탐이었다 — 호칭 쪽 목록과
    #   갈려 있던 것이고, `patterns`↔`words`가 갈려 조사 결합형이 우회했던 ⓛ와 같은
    #   형태다. **커버리지 매트릭스가 이걸 찾았다**(`test_redaction_coverage.py`) —
    #   사람이 두 목록을 대조하는 대신 곱집합을 돌린 첫 성과다.
    #   ⚠ `동생`은 호칭 갈래에 없다 — 여기만 있는 값이라 유지한다(줄이지 않는다).
    - '([가-힣]{2,3}이)(?=\s?(할아버지|할머니|아버지|학부모|보호자|삼촌|엄마|아빠|누나|언니|오빠|이모|동생|부모|형|군|양))'
    # 🔴 (8/5 신설) **성씨 + 이름 1~2자 + 조사** — "김민준이·박서연은·이도윤의"(정식 성명형).
    #   종전 3개 패턴은 별명형(`~이`+조사)만 잡아 **성이 붙은 정식 이름이 통째로 샜다**
    #   (실측 7건). 코퍼스가 별명형에 편중돼 "미탐 0" 게이트가 헛돌고 있었다.
    #   `$surnames`는 아래 목록으로 조립된 문자 클래스로 치환된다(코드가 정규식을 만들지
    #   않는다 — 조립만 한다 · §6). 성씨를 **유한 집합**으로 고정해 일반 명사 오탐을 억제한다.
    #   🔴 이름은 **정확히 2자**다(`{2}`). `{1,2}`로 넓히면 성씨 40자가 흔한 2음절 명사의
    #   첫 글자를 덮어 프롬프트 템플릿 빈출 어절 20종 중 **18종이 오탐**이었다
    #   (문의를·주제는·성적이…). `{2}`면 오탐이 1종으로 줄고 3자 성명은 전부 잡힌다.
    #   ⚠ 대가: **2자 성명**(`김철이`)은 이 패턴 밖이다 — 알려진 한계로 99에 등재했다.
    - '([$surnames][가-힣]{2})($particles_korean)(?![가-힣])'

  # 위 패턴의 `$surnames` 자리에 들어갈 한국 성씨 — 인구 상위 + 흔한 성.
  # ⚠ 목록 밖 희귀 성(남궁·제갈 등 복성 포함)은 이 패턴으로 안 잡힌다(99 등재).
  surnames:
    - 김
    - 이
    - 박
    - 최
    - 정
    - 강
    - 조
    - 윤
    - 장
    - 임
    - 한
    - 오
    - 서
    - 신
    - 권
    - 황
    - 안
    - 송
    - 류
    - 전
    - 홍
    - 고
    - 문
    - 양
    - 손
    - 배
    - 백
    - 허
    - 유
    - 남
    - 심
    - 노
    - 하
    - 곽
    - 성
    - 차
    - 주
    - 우
    - 구
    - 민
  density_threshold: 2   # 문장 내 후보 수 ≥ 이 값이면 문장 통째 ⟪확인필요⟫
  # 🔴 JSON 으로 이스케이프된 개행(\n 두 글자)도 문장 경계다.
  #   프롬프트는 ContextPack · payload 를 한 줄짜리 canonical JSON 으로 싣는다
  #   (problem_generation/application/generator.py). 그 안에서 원문의 문단 구분은
  #   실제 개행이 아니라 \n 문자열로 바뀜다. 종전 패턴은 「마침표 뒤 공백」을
  #   요구해 문단 경계를 못 갈랐고, 글 전체가 한 문장이 돼 인명 후보가
  #   전부 합산됐다(밀도 2+ → 문장 통째 차단).
  # ⚠ 문장 경계를 바로잡는 것이지 밀도 규칙을 뭄러주는 게 아니다 —
  #   후보 값은 여전히 개별로 마스킹된다. 실측(T3 문학): 종전 전건 차단 → 수정 후 정상 출제.
  sentence_split: '(?<=[.!?。])\s+|\n+|\\n'

# ── P9 문맥어 기반 잔여 위험 (fail-closed ⟪확인필요⟫ · [A 확정 7/23]) ──
# 정밀 패턴 불가 유형을 문맥어 결합으로 후보화 — 값 확정 아님, 오탐 감수. P8 다음·스코어링 앞.
context_risk:
  # ⓐ 카톡 ID: 문맥어(카톡·카카오톡[+아이디]) 인접의 영숫자 토큰(그룹1 치환)
  kakao: '(?:카카오톡|카톡)(?:\s?아이디)?\s*[:은는]?\s*([A-Za-z0-9_]{4,})'
  # ⓑ 기관명: 기관어 직전에 **공백 없이 붙은** 고유명사 후보(그룹1) — 지시어 오탐 차단.
  org: '([가-힣]{2,6})(교회|성당|동아리|스터디|학원)'
  # ⓒ 파일명: 확장자 포함 토큰(그룹0) 속 한글 2~3자 조각을 치환.
  filename: '[\w가-힣]+\.(?:xlsx|xls|csv|pdf|hwp)'
  filename_hangul: '[가-힣]{2,3}'

# ── 화이트리스트 ────────────────────────────────────────────
whitelists:
  # 학교 축약 오탐 제외(§2 P5) — 코퍼스와 함께 누적(§6)
  school_abbr_exclude:
    - "최고"
    - "중고"
    - "고교"
    - "초중고"
  # 흔한 '~동' 명사 오탐 제외(§2 P4) — **접미사(endswith) 매칭**이라
  # 복합어(장애'아동'·감정'노동'·이주'노동')까지 커버한다. 코퍼스와 함께 누적(§6).
  # (표준 2음절어 아동·노동은 [가-힣]{2,3}동에 애초 안 걸리나, 3음절+동 복합어는 걸림)
  address_dong_exclude:
    - "행동"
    - "운동"
    - "감동"
    - "활동"
    - "이동"
    - "부동"
    - "자동"
    - "작동"
    - "수동"
    - "충동"
    - "출동"
    - "합동"
    - "아동"
    - "노동"
    - "변동"
    - "협동"
    - "소동"
    - "진동"
    - "파동"
    - "맥동"
    - "격동"
    - "율동"
    - "반동"
  # 🔴 (8/5 신설) 성씨 기반 인명 패턴의 오탐 제외 — **학원 도메인 어휘**.
  # 성씨 한 글자가 흔한 한자어의 첫 글자와 겹쳐 생기는 오탐만 넣는다
  # (`성`적·`문`의·`정`도·`강`의…). ⚠ **추측으로 넣지 마라** — 제외 목록은 미탐
  # 방향으로 작용한다. 코퍼스를 돌려 **실제로 나온 오탐만** 누적한다(§6).
  # 실측 5건(8/5 코퍼스 전수) — **추측분 없음**. 넣기 전 오탐 5 → 넣은 뒤 0.
  # ⚠ 잔여 위험: 여기 적힌 어절과 **같은 철자의 실제 성명**은 마스킹되지 않는다
  #   (`정도`·`강의`를 이름으로 쓰는 사람). 일곱 다 성+이름으로는 성립하기 어려운
  #   조합이라 수용했고, 반례가 나오면 코퍼스에 추가하고 이 목록을 줄인다.
  # 실측 7종(8/5·8/10) — **프롬프트 고정 문구 전수 스캔**에서 나온 것만.
  # 추측분 0. 이것들이 `⟪확인필요⟫`를 만들면 트립와이어가 전송을 통째로 막는다.
  # ⚠ 잔여 위험: 같은 철자의 실제 성명은 마스킹되지 않는다 — 일곱 다 성+이름 2자로는
  #   성립하기 어려운 조합이라 수용했다(반례가 나오면 코퍼스에 추가하고 목록을 줄인다).
  name_exclude:
    - "서술자"
    - "하나라"
    - "문자열"
    - "문의여"
    - "정답률"
    - "강조점"
    - "한정어"
    # ── (8/21 · 99 #104·#123 · №53 실측 8문면) 상담 fact·완충 사전 빈출어 ──
    # 🔴 이 다섯은 **패턴을 안 고치고** 오탐만 뺀다 — 목록에 없는 것은 전부 그대로 잡힌다.
    #   축이 «성씨 40자 × 임의 2글자 × 조사 15개»라 형태 자체는 그대로다(두더지잡기 · 99 #178).
    # ⚠ 🔴 `정에서`는 **어간이 아니라 「잘린 조각」이다** — 규칙이 **어절 안쪽에서** 성씨를
    #   찾기 때문이다(`가정에서도`의 `가`를 버리고 `정에서`를 문다). **이 처방은 그 성질을
    #   안 고친다** — 앞 경계 조건은 미탐 위험이 미측정이라 별건이다(99 #178).
    # ⚠ 감시자는 코퍼스 65~72 다 — 어간을 빼면 그 여덟이 red 다(실측: `정에서` 제거 → 4 red).
    - "이번에"    # 이번에는 · 이번에도 제출 · (완충) 이번에는 결과가 나오지 않았습니다
    - "정리하"    # 정리하는 · 정리하는 습관
    - "이해력"    # 이해력이 부족 — (완충) B군 치환 쌍의 `from`
    - "정에서"    # 가정에서도 · 가정에서도 지도  ← 🔴 어절 안쪽 절단 산물
    - "다른"      # 다른 학생에 비해 — 🔴 이쪽은 `name_honorific` 경로다(redaction.py:311)
  # 문학 작품·교과 작가 인명(§5 케이스 23~26) — 시작은 코퍼스에 나오는 것만.
  # 유지보수: 새 오탐 발견 시 코퍼스에 추가하며 이 목록도 함께 누적(§6).
  literary_names:
    - "김유정"
    - "이상"
    - "김첨지"
    - "점순"
