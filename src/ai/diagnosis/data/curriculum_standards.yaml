# 2022 개정 국어과 교육과정 고등학교 성취기준 **코드 목록**.
#
# 🔴 **코드만 적는다 — 성취기준 문면은 옮기지 않는다.** 정본(교육부 고시 제2022-33호
# [별책 5])의 라이선스가 공공누리로 **추정될 뿐 확인되지 않았고**(05 §1.1.4), 같은
# 불확실성에서 사전 뜻풀이를 「참조만 하고 복제하지 않는다」로 정한 선례를 따른다.
# 코드는 식별자이므로 인용해도 저작물 복제가 아니다.
#
# ⚠ **이 파일의 쓸모는 「인용 어휘의 정본」이다.** `curriculum_graph.yaml` 노드가
# `curriculum-2022:<code>` 로 근거를 달면 그 코드가 실재하는지 여기서 대조한다
# (`test_curriculum_graph_data.py`). 없는 코드를 인용하면 CI가 막는다.
#
# ⚠ **중등·초등 성취기준은 담지 않는다** — v1은 수능 대비 고등만 본다(CLAUDE.md §0).

