name: CI

# 두 잡:
#  1) lint-type-test — ruff·mypy·pytest(fake 기본, integration 마커 제외).
#     **ubuntu + windows 매트릭스**(2026-07-30 신설). 개발 OS가 맥(A)·Windows(B)로
#     갈리는데 CI가 리눅스 단일이라, Windows에서만 깨지는 것을 아무도 못 잡았다 —
#     경로 구분자 버그가 B의 로컬에서만 빨갰다. ruff·mypy·pytest 세 단계를 두 OS로
#     동일하게 돌린다(스텝 레벨 `if:` 금지 — 체크가 조용히 안 도는 실패 모드).
#     mypy를 Windows에서도 돌리는 이유: 분기가 없어도 typeshed 스텁이 OS별로 갈린다
#     (fcntl·pwd·SIGKILL 등 POSIX 전용). B가 에디터에서 Windows mypy를 돌리므로
#     CI가 안 돌리면 같은 비대칭이 mypy에서 재발한다.
#     `fail-fast: false` — 한쪽이 깨질 때 다른 쪽이 취소되면 신호를 잃는다.
#  2) integration-pg — postgres:16 서비스 + `pytest -m integration`(99_open_items ⑫).
#     PG 통합 3건(직접 접속·create_all·미가용 시 skip)이 실 PG로 돈다. LLM 스모크 2건은
#     LOCAL_LLM env·서버가 없어 자동 skip.
#     ⚠ **여기엔 매트릭스를 걸지 않는다** — GitHub Actions의 `services:` 컨테이너는
#     Linux 러너 전용이라 Windows에서는 잡이 기동조차 못 한다. Linux 고정.
# 소유: 박진희(A) — docs/02_ownership §2.

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  lint-type-test:
    name: ruff · mypy · pytest (fake) · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install deps (uv.lock 고정)
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest (fake 기본 · integration 제외)
        run: uv run pytest

  integration-pg:
    name: pytest -m integration (postgres:16)
    runs-on: ubuntu-latest
    services:
      # ⚠ 이 값들은 로컬 docker-compose.yml과 일치해야 한다(레포 안 정본 = 이 워크플로).
      #   docker-compose.yml은 로컬 전용(.gitignore) — postgres:16 · checkon/checkon/checkon_ai · 5432.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: checkon
          POSTGRES_PASSWORD: checkon
          POSTGRES_DB: checkon_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U checkon -d checkon_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install deps (uv.lock 고정)
        run: uv sync --frozen

      - name: Pytest -m integration (실 PG)
        # PG 통합 테스트는 database_url로 직접 접속(create_all로 스키마 생성 — alembic 불필요).
        # LLM 스모크 2건은 LOCAL_LLM_* 미설정이라 skip.
        env:
          DATABASE_URL: postgresql+asyncpg://checkon:checkon@localhost:5432/checkon_ai
        run: uv run pytest -m integration
