# Alembic 설정 — D-② (docs/06_erd.md 정본)
# DB URL은 여기 두지 않는다(하드코딩 금지) — env.py가 ai.db.settings로 주입한다.
[alembic]
script_location = src/ai/db/migrations
prepend_sys_path = src
path_separator = os
# 마이그레이션 파일명: 리비전ID_슬러그 (시각은 파일 헤더에)
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
