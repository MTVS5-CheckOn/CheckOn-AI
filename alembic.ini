# Alembic config. Canonical spec: docs/06_erd.md (D-2).
# Do not put the DB URL here (no hardcoding) -- env.py injects it from ai.db.settings.
#
# ASCII-ONLY ON PURPOSE -- do not add Korean comments to this file.
# Alembic reads it with configparser encoding="locale", which is the ANSI code page
# on Windows (cp949 on ko-KR) regardless of `chcp`. Non-ASCII bytes here make the
# deploy command `alembic upgrade head` die with UnicodeDecodeError before it ever
# reaches the database. Korean notes belong in docs/06_erd.md.
# Guarded by tests/ai/contract/test_alembic_ini_locale_safe.py.
[alembic]
script_location = src/ai/db/migrations
prepend_sys_path = src
path_separator = os
# Migration file name: revision id + slug (the timestamp lives in the file header).
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
