<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>체크온 — 리포트 스튜디오 · 목록 / 수정 / 발송</title>
<style>
/* ══════════ 1. 토큰 ══════════
   앞 세 줄은 체크온_발행내역_재사용_v1 의 것을 그대로 쓴다 — 같은 제품의 같은 셸이다.
   그 아래는 리포트 지면에만 필요해서 새로 세웠다. 색을 이 블록 밖에서 쓰지 않는다. */
:root{
  --ink:#1f2937;--sub:#6b7280;--line:#e5e7eb;--line2:#d1d5db;--bg:#f1f3f5;
  --accent:#2563eb;--brand:#ff9a3c;--soft:#eff6ff;
  --d-blue:#3b82f6;--d-green:#5cb894;--d-yellow:#f0c04a;--d-red:#e2574c;--d-track:#e8eaed;

  /* A4 — CSS mm 은 96dpi 고정비라 화면 794×1123px 과 인쇄가 정확히 같다 */
  --pw:210mm;--ph:297mm;--pmar:14mm 15mm;
  --paper:#fff;--pline:#eceef1;--pgray:#9ca3af;
  --ai:#7c3aed;--ai-bg:#f5f3ff;--ai-line:#ddd6fe;
  --tch:#b45309;--tch-bg:#fffbeb;--tch-line:#fcd34d;   /* 강사가 직접 쓴 문단 */
  --ok:#065f46;--ok-bg:#ecfdf5;--ok-line:#6ee7b7;
  --warn:#92400e;--warn-bg:#fffbeb;--warn-line:#fcd34d;
  --no:#991b1b;--no-bg:#fff7f7;--no-line:#fca5a5;
  --hold:#475569;--hold-bg:#f8fafc;--hold-line:#cbd5e1;
  --mono:ui-monospace,Menlo,Consolas,monospace;

  /* 역할별 타입 스케일 — 화면·A4 지면이 같은 위계를 공유한다 */
  --fs-display:38px;--fs-metric:44px;--fs-metric-compact:30px;
  --fs-page-title:20px;--fs-screen-title:16px;--fs-section-title:14px;
  --fs-body-strong:13px;--fs-body:12px;--fs-meta:11px;--fs-caption:10px;--fs-footnote:9px;

  /* 역할별 간격 스케일 — 인라인·카드·섹션·지면의 리듬을 고정한다 */
  --space-hair:2px;--space-xs:4px;--space-sm:6px;--space-md:8px;
  --space-lg:10px;--space-xl:14px;--space-section:18px;--space-page-section:22px;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Pretendard','Apple SD Gothic Neo','Segoe UI',sans-serif;}
body{background:var(--bg);color:var(--ink);font-size:13px;}

/* ══════════ 2. 셸 ══════════ */
.app{display:grid;grid-template-columns:212px 1fr;min-height:100vh;}
.nav{background:#fff;border-right:1px solid var(--line);padding:18px 12px;}
.logo{font-size:var(--fs-page-title);font-weight:800;color:var(--brand);padding:0 8px 2px;letter-spacing:-.5px;}
.logo span{color:#5bc8f5;}
.who{font-size:var(--fs-meta);color:var(--sub);padding:8px 8px 10px;font-weight:600;}
.acad{width:100%;border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12px;background:#fff;margin-bottom:14px;}
.nav a{display:block;padding:9px 10px;border-radius:8px;color:#374151;text-decoration:none;font-size:var(--fs-body);margin-bottom:2px;cursor:pointer;}
.nav a:hover{background:#f8fafc;}
.nav a.on{background:#f1f5f9;font-weight:700;color:#111827;}
.nav .sub2{display:block;padding:7px 10px 7px 22px;font-size:12px;color:var(--sub);border-radius:8px;cursor:pointer;}
.nav .sub2:hover{background:#f8fafc;}
.nav .sub2.on{background:var(--soft);color:#1d4ed8;font-weight:700;}
.nav .grp{font-size:10px;color:var(--pgray);padding:12px 10px 5px;font-weight:700;letter-spacing:.4px;}
.main{padding:16px 20px 40px;min-width:0;}

/* ══════════ 3. 공용 컴포넌트 — 발행내역 v1 과 동일 ══════════ */
.pgttl{font-size:var(--fs-screen-title);font-weight:800;margin-bottom:3px;}
.pgsub{font-size:var(--fs-meta);color:var(--sub);margin-bottom:12px;line-height:1.7;}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;}
.btn{padding:7px 13px;border:1px solid var(--line2);border-radius:8px;background:#fff;font-size:12px;cursor:pointer;color:#374151;}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.pri:hover{background:#1d4ed8;color:#fff;}
.btn.off{opacity:.42;cursor:not-allowed;}
.btn.off:hover{border-color:var(--line2);color:#374151;}
.btn.sm{padding:4px 9px;font-size:11px;}
.btn.ic{padding:4px 8px;font-size:12px;line-height:1.3;}
.sel{border:1px solid var(--line2);border-radius:999px;padding:6px 11px;font-size:12px;background:#fff;cursor:pointer;}
.filters{display:flex;gap:7px;align-items:center;padding:12px 16px;flex-wrap:wrap;}
.note{font-size:var(--fs-meta);color:var(--sub);line-height:1.75;padding:12px 16px;}
.note.page-note{padding:var(--space-lg) 0 0;}
.note b{color:#374151;}
.red{color:#b91c1c;font-weight:700;}
.sec{margin-bottom:16px;}
.sec>h4{font-size:var(--fs-meta);color:var(--sub);font-weight:700;margin-bottom:7px;}
.box{border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-size:12px;line-height:1.8;background:#fcfcfd;}
.box .r{display:flex;justify-content:space-between;gap:10px;}
.box .r span{color:var(--sub);}
.chip{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;margin:1px 3px 1px 0;border:1px solid;}
.chip.a{background:var(--soft);border-color:#bfdbfe;color:#1d4ed8;}
.chip.t{background:var(--ai-bg);border-color:var(--ai-line);color:#6d28d9;}
.chip.b{background:#f8fafc;border-color:var(--line2);color:#475569;}
.chip.warn{background:#fff7ed;border-color:#fdba74;color:#9a3412;}
.verd{border-radius:9px;padding:11px 13px;font-size:12px;line-height:1.75;}
.verd.ok{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok);}
.verd.warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn);}
.verd.no{background:var(--no-bg);border:1px solid var(--no-line);color:var(--no);}
.verd.hold{background:var(--hold-bg);border:1px solid var(--hold-line);color:var(--hold);}
.verd code{background:rgba(0,0,0,.06);border-radius:4px;padding:1px 5px;font-size:var(--fs-caption);font-family:var(--mono);}
.verd .line{display:flex;justify-content:space-between;gap:10px;border-top:1px dotted rgba(0,0,0,.14);margin-top:7px;padding-top:6px;}
.tg{font-size:10px;padding:2px 8px;border-radius:5px;font-weight:700;}
.tg.free{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line);}
.tg.cost{background:#fff7ed;color:#9a3412;border:1px solid #fdba74;}
.tg.re{background:var(--soft);color:#1d4ed8;border:1px solid #bfdbfe;}
.chk{width:15px;height:15px;border:1.5px solid var(--line2);border-radius:4px;flex:0 0 auto;position:relative;background:#fff;cursor:pointer;}
.chk.on{background:var(--accent);border-color:var(--accent);}
.chk.on::after{content:'\2713';color:#fff;font-size:11px;position:absolute;left:2px;top:-2px;}
.chk.dis{background:#f3f4f6;border-style:dashed;cursor:not-allowed;}
.ctr{width:100%;border-collapse:collapse;font-size:var(--fs-meta);}
.ctr th,.ctr td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;}
.ctr th{background:#fafbfc;color:var(--sub);font-size:var(--fs-caption);font-weight:700;}
.ctr code{background:#f3f4f6;border-radius:4px;padding:1px 5px;font-size:var(--fs-caption);font-family:var(--mono);color:#374151;}
.own{display:inline-block;font-size:var(--fs-footnote);padding:1px 6px;border-radius:4px;font-weight:700;color:#fff;}
.own.ai{background:#b45309;} .own.be{background:#0e7490;} .own.fe{background:#7c3aed;}
details summary{cursor:pointer;font-size:12px;font-weight:700;padding:11px 16px;}

/* ══════════ 4. 목록 ══════════ */
.mnav{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);}
.mnav .m{font-size:var(--fs-screen-title);font-weight:800;min-width:110px;text-align:center;font-variant-numeric:tabular-nums;}
.mnav .side{font-size:var(--fs-body);color:var(--pgray);cursor:pointer;padding:5px 9px;border-radius:6px;font-variant-numeric:tabular-nums;}
.mnav .side:hover{background:#f8fafc;color:var(--accent);}
.sum{display:flex;border-top:1px solid var(--line);}
.sum div{flex:1;padding:11px 16px;border-right:1px solid var(--line);}
.sum div:last-child{border:none;}
.sum .k{font-size:var(--fs-caption);color:var(--sub);}
.sum .v{font-size:var(--fs-section-title);font-weight:800;margin-top:3px;}
.sum .v small{font-size:11px;color:var(--pgray);font-weight:500;}
.rt{width:100%;border-collapse:collapse;font-size:12px;}
.rt th{background:#fafbfc;color:var(--sub);font-size:var(--fs-caption);font-weight:700;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);}
.rt td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
.rt tr:last-child td{border-bottom:none;}
.rt tbody tr{cursor:pointer;}
.rt tbody tr:hover{background:#fbfdff;}
.rt tr.dim{background:#fcfcfd;}
.rt tr.dim:hover{background:#fafafa;}
.rt .nm{font-weight:700;font-size:var(--fs-body);}
.rt .nm small{display:block;font-weight:500;font-size:var(--fs-caption);color:var(--pgray);margin-top:2px;font-family:var(--mono);}
.rt .num{font-variant-numeric:tabular-nums;font-weight:700;}
.rt .dash{color:var(--pgray);font-weight:500;}
.rt .acts{display:flex;gap:4px;justify-content:flex-end;}
.st{font-size:11px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-weight:700;}
.st i{width:6px;height:6px;border-radius:50%;display:inline-block;background:var(--pgray);}
.st.done{color:#1d4ed8;} .st.done i{background:var(--d-blue);}
.st.sent{color:var(--ok);} .st.sent i{background:var(--d-green);}
.st.hold{color:var(--hold);} .st.hold i{background:var(--hold-line);}
.st.no{color:#9f1239;} .st.no i{background:#e11d48;}
.empty{padding:26px;color:var(--pgray);text-align:center;}

/* ══════════ 5. 수정 ══════════ */
.edit{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;align-items:start;}
.tool{background:#fff;border:1px solid var(--line);border-radius:12px;position:sticky;top:16px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;}
.tool .th{padding:13px 15px;border-bottom:1px solid var(--line);}
.tool .tb{padding:14px 15px;overflow:auto;flex:1;}
.tool .tf{padding:12px 15px;border-top:1px solid var(--line);background:#fafbfc;}
.tool.ro .tb,.tool.ro .tf{opacity:.42;pointer-events:none;}
.scope{display:flex;gap:6px;margin-bottom:10px;}
.scope button{flex:1;padding:7px;border:1px solid var(--line2);border-radius:8px;background:#fff;font-size:var(--fs-meta);cursor:pointer;color:#374151;}
.scope button.on{border-color:var(--accent);background:var(--soft);color:#1d4ed8;font-weight:700;}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.presets button{padding:9px 6px;border:1px solid var(--line2);border-radius:8px;background:#fff;font-size:var(--fs-meta);cursor:pointer;color:#374151;line-height:1.4;}
.presets button:hover{border-color:var(--accent);color:var(--accent);}
.presets button small{display:block;font-size:var(--fs-footnote);color:var(--pgray);margin-top:2px;font-family:var(--mono);}
textarea.instr{width:100%;min-height:62px;border:1px solid var(--line2);border-radius:8px;padding:9px 10px;font-size:12px;resize:vertical;line-height:1.6;}
textarea.instr:focus{outline:none;border-color:var(--accent);}
.rev{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:5px;font-size:var(--fs-meta);line-height:1.6;}
.rev .no{font-weight:800;font-family:var(--mono);color:var(--sub);flex:0 0 auto;}
.rev.cur{border-color:var(--accent);background:#fbfdff;}
.rev.blocked{border-color:var(--no-line);background:var(--no-bg);}
.rev.tchrev{border-color:var(--tch-line);background:var(--tch-bg);}
.rev[data-act]{cursor:pointer;}
.rev[data-act]:hover{border-color:var(--accent);}
.rev .tail{margin-left:auto;flex:0 0 auto;}

/* ══════════ 6. 발송 ══════════ */
.srow{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;}
.srow:last-child{border-bottom:none;}
.srow:hover{background:#fbfdff;}
.srow.dis{background:#fcfcfd;cursor:default;}
.srow.dis:hover{background:#fcfcfd;}
.srow .grow{flex:1;min-width:0;}
.srow .tail{margin-left:auto;text-align:right;flex:0 0 auto;}
.sendbar{position:sticky;bottom:0;display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;box-shadow:0 -3px 14px rgba(0,0,0,.06);}
.drawer{position:fixed;top:0;right:0;width:640px;max-width:100vw;height:100vh;background:#fff;border-left:1px solid var(--line2);box-shadow:-8px 0 26px rgba(0,0,0,.1);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s;z-index:50;}
.drawer.open{transform:none;}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);}
.dh b{font-size:14px;}
.dbody{overflow:auto;padding:14px 16px 16px;flex:1;background:var(--bg);}
/* A4 실물 폭(794px)이 드로어보다 넓다 — zoom 은 레이아웃까지 줄여서 가로 스크롤이 안 생긴다 */
.dbody .sheet,.dbody .legend{zoom:.72;}
.dfoot{border-top:1px solid var(--line);padding:12px 16px;background:#fafbfc;}
.x{cursor:pointer;color:var(--pgray);font-size:var(--fs-screen-title);}

/* ══════════ 7. 리포트 지면 ══════════
   수정 화면 좌측 · 발송 드로어 · 인쇄 미리보기가 이 하나를 공유한다. */
/* 모든 면이 A4 한 장으로 정규화된다 — 여백이 남아도 크기는 같다 */
.sheet-scroll{overflow-x:auto;padding-bottom:4px;}
.sheet{width:var(--pw);margin:0 auto;}
.pg{position:relative;display:flex;flex-direction:column;width:var(--pw);min-height:var(--ph);
    background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:var(--pmar);margin-bottom:14px;
    box-shadow:0 2px 10px rgba(30,55,100,.05);}
.pgno{position:absolute;left:0;right:0;bottom:7mm;text-align:center;font-size:var(--fs-footnote);color:var(--pgray);letter-spacing:.06em;}
.ovf{position:absolute;top:6px;right:8px;background:var(--no-bg);border:1px solid var(--no-line);color:var(--no);
     font-size:var(--fs-footnote);font-weight:800;border-radius:5px;padding:2px 7px;}
.legend{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 14px;margin-bottom:10px;width:var(--pw);margin-left:auto;margin-right:auto;}
.legend b{color:#374151;}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px;}
.legend .fix{background:var(--accent);} .legend .gen{background:var(--ai);} .legend .tch{background:var(--tch);}
.cover{justify-content:flex-start;}
.cover .rule{border-bottom:1px solid var(--ink);padding-bottom:7px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;}
.cover .big{margin-top:70px;text-align:right;font-size:var(--fs-display);font-weight:300;line-height:1.24;color:#4b5563;letter-spacing:-.01em;}
.cover .sub{text-align:right;margin-top:14px;font-size:13px;font-weight:700;line-height:1.8;}
.cover .sub small{display:block;font-weight:500;color:var(--sub);font-family:var(--mono);font-size:var(--fs-caption);margin-top:5px;}
.cover .mark{margin-top:auto;padding-top:56px;text-align:center;font-size:var(--fs-page-title);font-weight:800;color:var(--brand);letter-spacing:-.5px;}
.cover .mark span{color:#5bc8f5;}
.rhead{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1.5px solid var(--ink);padding-bottom:9px;margin-bottom:6px;}
.rhead h3{font-size:var(--fs-page-title);font-weight:800;letter-spacing:-.02em;}
.rhead .who2{font-size:13px;font-weight:700;}
.rmeta{text-align:right;font-size:var(--fs-caption);color:var(--sub);margin-bottom:var(--space-page-section);font-variant-numeric:tabular-nums;}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 34px;}
.kpi .kh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
.tag{font-size:var(--fs-meta);font-weight:800;color:#fff;border-radius:6px;padding:4px 10px;white-space:nowrap;}
.kpi .cmp{font-size:10px;color:var(--pgray);}
.kpi .cmp::before{content:'\25CB\00A0';}
.kpi .row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.kpi .v{font-size:var(--fs-metric);font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
.kpi .v small{font-size:var(--fs-screen-title);font-weight:700;margin-left:1px;}
.kpi .foot{font-size:var(--fs-footnote);color:var(--pgray);line-height:1.7;margin-top:var(--space-lg);padding-top:var(--space-md);border-top:1px dotted var(--pline);}
.spark{flex:0 0 172px;}
.spark .xs{display:flex;justify-content:space-between;font-size:var(--fs-footnote);color:var(--pgray);margin-top:2px;}
.spark .xs b{font-weight:800;}
.bandbar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--d-track);margin-top:14px;}
.bandbar i{display:block;height:100%;}
.bandlg{display:flex;justify-content:space-between;font-size:var(--fs-footnote);color:var(--sub);margin-top:7px;}
.bandlg i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px;}
.bandlg b{font-weight:800;color:var(--ink);}
.asof{display:inline-block;font-size:var(--fs-footnote);color:var(--pgray);border:1px solid var(--pline);border-radius:5px;padding:2px 7px;margin-top:16px;}
.wk{margin-bottom:19px;}
.wk .wh{display:flex;align-items:center;gap:9px;margin-bottom:8px;}
.wbars{display:flex;align-items:flex-end;gap:4px;height:60px;border-bottom:1.5px solid var(--pline);}
.wbars .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%;position:relative;}
.wbars .b{width:64%;border-radius:2px 2px 0 0;background:var(--d-track);}
.wbars .c.on .b{background:var(--bar);}
.wbars .t{font-size:9px;color:var(--pgray);font-variant-numeric:tabular-nums;}
.wbars .c.on .t{color:var(--bar);font-weight:800;}
.wbars .mk{position:absolute;top:-3px;font-size:11px;line-height:1;}
.wxs{display:flex;gap:4px;margin-top:5px;}
.wxs span{flex:1;text-align:center;font-size:9px;color:var(--pgray);}
.wxs span.on{color:var(--ink);font-weight:800;}
.mx{width:100%;border-collapse:collapse;font-size:var(--fs-meta);}
.mx th,.mx td{border:1px solid var(--pline);padding:7px 8px;text-align:center;}
.mx th{background:#fafbfc;color:var(--sub);font-size:var(--fs-caption);font-weight:700;}
.mx th.a{text-align:left;width:126px;}
.mx td.a{text-align:left;font-weight:700;}
.mx td.a small{display:block;font-weight:500;font-size:var(--fs-footnote);color:var(--pgray);}
.mx td.res{color:var(--pgray);background:repeating-linear-gradient(135deg,#fafafa,#fafafa 4px,#f4f4f5 4px,#f4f4f5 8px);font-size:10px;}
.cell{display:block;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;}
.cell small{display:block;font-weight:500;font-size:var(--fs-footnote);color:var(--pgray);margin-top:1px;}
.cell.weak{color:var(--d-red);} .cell.ok{color:var(--d-green);} .cell.unknown{color:var(--pgray);}

  {id:'RP-2608-018', alias:'stu_bb54', nm:'오○○', grade:'고2', elective:'화법과 작문',   cls:'고2-1 · 목요일반',   kind:'report',        status:'generated',             sent:false, seed:54}

/* ── 3. 파생 — 시드에서 결정론으로 만든다(같은 시드 = 같은 화면) ──── */
function rng(seed){ let s=(seed*2654435761)>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
const pc = x => Math.round(x*100);

/* 선택과목이 어떤 영역을 여는가 — 공통(독서·문학)은 늘 열려 있다 */
const ELECTIVE_AREAS = {'언어와 매체':['language','media'], '화법과 작문':['speech_writing'], '미정':[]};
function isOffSubject(area, elective){
  if(area.track === '공통') return false;
  const mine = ELECTIVE_AREAS[elective] || [];
  return mine.length > 0 && !mine.includes(area.k);
}

function build(b){
  const r = rng(b.seed), R = Object.assign({}, b);
  if(b.status !== 'generated') return R;

  R.pct    = 34 + Math.floor(r()*52);                      /* 전국 백분위 — benchmarks 로 들어오는 단일 값 */
  R.pctAt  = '2026-07-31';                                 /* as_of — 값과 함께 온다 */
  /* 출제 난이도 분포 — 체크온이 발행한 세트 문항만. 학원 교재·모의고사 문항엔 밴드가 없다 */
  R.bands  = {low: 12+Math.floor(r()*26), medium: 30+Math.floor(r()*44), high: 8+Math.floor(r()*22)};
  R.weeks = Array.from({length:12}, (_,i) => ({
    acc: .48 + r()*.42,
    vol: 40 + Math.floor(r()*150),
    mark: i===8 ? '보강' : (i===6 ? '상담' : null)          /* 개입 시점 마커 */
  }));
  R.weeks.forEach((w,i)=>{
    w.eventN = i===9 ? 7 : 12 + Math.floor(r()*34);          /* DiagnosisEvent 주차 표본 */
    w.mis = Math.floor(r()*Math.max(2, w.eventN*.22));       /* misconception_tag 존재 건 */
    w.nodeN = 2 + Math.floor(r()*Math.min(9, w.eventN));     /* skill_node_id distinct */
  });

  /* 영역×유형 셀 — 선택과목 밖 영역은 표본이 거의 없다 */
  R.cells = {};
  let sum=0, cnt=0;
  AREA.forEach(a=>{
    const off = isOffSubject(a, b.elective);
    V1_TYPE.forEach(t=>{
      const n   = off ? Math.floor(r()*6) : 6 + Math.floor(r()*46);
      const acc = .38 + r()*.50;
      R.cells[a.k+'.'+t.k] = {n, acc};
      if(n >= MIN_N){ sum += acc*n; cnt += n; }
    });
  });
  R.acc   = cnt ? sum/cnt : 0;                             /* 전체 정답률 = 가중 평균 */
  R.items = cnt;                                           /* graded_count — 채점된 문항만(n_solves 아님) */
  /* 개인 기준선 — detection/baseline.Baseline: accuracy · volume(주당 평균) */
  R.base = {acc: Math.min(.95, Math.max(.2, R.acc - .06 + r()*.12)),
            volWeek: Math.round(R.items/4 * (.82 + r()*.34)),
            weeksUsed: 6};

  /* 판정은 자기 평균과의 거리로 — 반 평균이 아니라 자기 평균이다 */
  Object.values(R.cells).forEach(c=>{
    c.verdict = c.n < MIN_N ? 'unknown' : (c.acc < R.acc - .10 ? 'weak' : 'ok');
    c.severity = c.verdict==='weak' ? Math.min(1, (R.acc-c.acc)/Math.max(R.acc,.01)) : null;
  });

  /* 영역 레이더 — 내 성취도 vs 내 기준선. 영역별 전국 평균은 benchmarks 에 없다 */
  R.radar = AREA.map(a=>{
    const cs = V1_TYPE.map(t=>R.cells[a.k+'.'+t.k]).filter(c=>c.n>=MIN_N);
    const mine = cs.length ? cs.reduce((s,c)=>s+c.acc*c.n,0)/cs.reduce((s,c)=>s+c.n,0) : null;
    return {area:a, mine, n: cs.reduce((s,c)=>s+c.n,0)};
  });

  /* 아래 값은 새로 발명한 추천값이 아니라 이미 수신·조립되는 출제 축의 목업이다. */
  R.wrongChoices = [1,2,3,4,5].map(no=>({no, count:1+Math.floor(r()*18)}));
  R.formats = [
    {label:'객관식', count:Math.max(1, Math.round(R.items*.92))},
    {label:'단답형', count:Math.max(1, Math.round(R.items*.08))}
  ];
  R.tagConfirmed = {yes:Math.max(1, Math.round(R.items*(.78+r()*.17))), total:R.items};

  const areaKeys = AREA.map(a=>a.k).sort();                  /* 조립기 group_key 사전순 */
  R.misconceptions = {
    byArea:areaKeys.flatMap((areaKey,ai)=>{
      if(ai===1) return [];
      const tags=['scope_confusion','relation_reversal','concept_mix'];
      return tags.slice(0,1+(ai%2)).map((tag,ti)=>({
        groupKey:areaKey, tag, count:1+((b.seed+ai*3-ti)%7)
      })).sort((x,y)=>y.count-x.count || x.tag.localeCompare(y.tag));
    }),
    byNode:[
      {groupKey:NODE[0].k, tag:'concept_mix', count:2+(b.seed%4)},
      {groupKey:NODE[2].k, tag:'scope_confusion', count:1+(b.seed%3)}
    ],
    excludedMissingChosenNo:b.seed%2,
    excludedMissingMisconceptionTag:(b.seed+1)%3
  };
  R.nodes = [
    {nodeId:NODE[0].k, area:NODE[0].area, verdict:'weak_confirmed', basis:['채점 이벤트 8건','영역×유형 셀 판정 1건']},
    {nodeId:NODE[2].k, area:NODE[2].area, verdict:'suspect', basis:['채점 이벤트 5건']},
    {nodeId:NODE[4].k, area:NODE[4].area, verdict:'ok', basis:['채점 이벤트 12건']}
  ];
  R.propagated = [
    {nodeId:NODE[1].k, area:NODE[1].area, score:.72+(r()*.12), fromNodes:[NODE[0].k]},
    {nodeId:NODE[3].k, area:NODE[3].area, score:.54+(r()*.12), fromNodes:[NODE[2].k,NODE[4].k]}
  ];
  /* seed 72는 오개념·근본 원인 부재도 정상 화면인지 확인하는 고정 빈 상태 픽스처다. */
  if(b.seed===72){
    R.misconceptions.byArea=[]; R.misconceptions.byNode=[];
    R.nodes=[]; R.propagated=[];
  }

  R.blocks = blocksOf(R);
  return R;
}

/* 해설 블록 — AI 초안의 문장 속 수치는 전부 위에서 확정된 값에서만 뽑는다(불변식 1·2).
   각 블록은 owner 를 갖는다: 'ai'(생성 원문) | 'teacher'(강사가 지면에서 직접 고친 것).
   강사 편집분은 draft_edit 경로이고 게이트·수치 대조를 거치지 않는다 — 그래서 표시를 가른다. */
function blocksOf(R){

    {seq:1, type:'fact', html:

      '꾸준히 분량을 채워 온 점이 기록에 그대로 남아 있습니다.'},

        (good ? num(good.label)+'은(는) '+num(pc(good.acc)+'%')+'로 안정적이어서, 잘 되는 쪽의 접근 방식을 이 항목에도 옮겨 볼 수 있겠습니다.' : '')
      : '이번 달에는 자기 평균보다 뚜렷하게 낮은 항목이 나타나지 않았습니다.'},
    {seq:3, type:'fact', chart:'improvement_trend', html:
      '보강을 진행한 주의 정답률이 '+num(pc(w1.acc)+'%')+'였고 이번 달 마지막 주는 '+num(pc(w2.acc)+'%')+'였습니다. '+
      (w2.acc>=w1.acc ? '보강 이후 흐름이 위쪽으로 움직이고 있습니다.' : '아직 보강 효과가 수치로 드러나기까지는 시간이 조금 더 필요해 보입니다.')},
    {seq:4, type:'fact', chart:'national_percentile', html:
      '전국 동일 학년 기준 백분위는 '+num(R.pct)+'입니다. 한 달치 표본으로 계산한 참고치이며, '+
      '지금은 순위보다 앞선 항목별 흐름을 함께 보시는 편이 도움이 됩니다.'},
    {seq:5, type:'suggestion', html: weak
      ? '다음 달에는 '+num(weak.label)+'을(를) 주 1회 소단위로 배치하려 합니다. 한 번에 많이 하기보다 짧게 자주 만나는 편이 이 유형에는 잘 맞습니다.'
      : '다음 달에는 지금 흐름을 유지하면서 표본이 부족한 항목을 채워 보려 합니다.'},
    {seq:6, type:'closing', html:
      '궁금하신 점은 언제든 편하게 남겨 주세요. 다음 달에 다시 정리해 드리겠습니다.'}
  ];
}

/* 셀을 판정별로 정렬해 대표 항목을 뽑는다 */
function ranked(R, verdict){
  const out=[];
  AREA.forEach(a=>V1_TYPE.forEach(t=>{
    const c = R.cells[a.k+'.'+t.k];
    if(c.verdict === verdict) out.push({label:a.n+' × '+t.n, acc:c.acc, n:c.n, area:a, type:t});
  }));
  return out.sort((x,y)=> verdict==='weak' ? x.acc-y.acc : y.acc-x.acc);
}

/* 3개월 미니 추이 — 내 값(색) + 내 기준선(회색 수평선)
   회색선은 전국 평균이 아니라 detection/baseline 의 개인 이동 기준선이다.
   전국 평균 정답률·학습량은 benchmarks 계약에 없어서 그릴 값이 없다. */
function spark(series, baseVal, color, fmt){
  const W=172, H=58, pad=16;
  const all = series.concat([baseVal]), lo=Math.min.apply(null,all), hi=Math.max.apply(null,all);
  const span = (hi-lo)||1;
  const x = i => pad + i*(W-pad*2)/(series.length-1);
  const y = v => H-16 - (v-lo)/span*(H-30);
  const by = y(baseVal);
  let dots='', labs='';
  series.forEach((v,i)=>{
    dots += '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="3.4" fill="'+color+'"/>';
    labs += '<text x="'+x(i).toFixed(1)+'" y="'+(y(v)-8).toFixed(1)+'" text-anchor="middle" font-size="10" font-weight="800" fill="'+color+'">'+fmt(v)+'</text>';
  });
  return '<div class="spark"><svg width="100%" viewBox="0 0 '+W+' '+H+'">'+
    '<line x1="'+pad+'" y1="'+by.toFixed(1)+'" x2="'+(W-pad)+'" y2="'+by.toFixed(1)+'" stroke="#d6dae0" stroke-width="1.5" stroke-dasharray="4 3"/>'+
    '<text x="'+(W-pad)+'" y="'+(by+11).toFixed(1)+'" text-anchor="end" font-size="9" fill="#aab0b9">내 기준선 '+fmt(baseVal)+'</text>'+
    '<path d="'+series.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ')+'" fill="none" stroke="'+color+'" stroke-width="2"/>'+
    dots + labs + '</svg>'+
    '<div class="xs"><span>'+(PERIOD.m-2)+'월</span><span>'+(PERIOD.m-1)+'월</span><b>'+PERIOD.m+'월</b></div></div>';
}

/* 아래 차트의 인라인 style 은 데이터가 막대 길이·계열 색을 결정하므로 정적 클래스로 옮길 수 없다. */
/* 출제 난이도 분포 — 하·중·상 3밴드(DifficultyBand). 추이가 아니라 분포다 */
function bandBar(bands){
  const order = [['low','하','var(--d-green)'], ['medium','중','var(--d-yellow)'], ['high','상','var(--d-red)']];
  const total = order.reduce((s,[k])=>s+bands[k], 0) || 1;
  return '<div class="spark"><div class="bandbar">'+
    order.map(([k,,c])=>'<i style="width:'+(bands[k]/total*100)+'%;background-color:'+c+'"></i>').join('')+
    '</div><div class="bandlg">'+
    order.map(([k,ko,c])=>'<span><i style="background:'+c+'"></i>'+ko+' <b>'+bands[k]+'</b></span>').join('')+
    '</div></div>';
}

/* side 는 오른쪽 시각 요소 — 스파크라인·분포 막대·없음 중 하나 */
function kpi(tag, color, value, unit, cmp, side, foot){
  return '<div class="kpi"><div class="kh">'+
    '<span class="tag" style="background:'+color+'">'+tag+'</span>'+
    (cmp ? '<span class="cmp">'+cmp+'</span>' : '')+'</div>'+
    '<div class="row"><div class="v" style="color:'+color+'">'+value+(unit?'<small>'+unit+'</small>':'')+'</div>'+
    (side||'')+'</div>'+
    '<div class="foot">'+foot+'</div></div>';
}

/* 주차별 막대 — 마지막 4주(이번 달)만 색을 준다 */
function weekChart(title, chip, color, weeks, pick, fmt){
  const vals = weeks.map(pick), hi = Math.max.apply(null, vals) || 1;
  let bars='', xs='';
  weeks.forEach((w,i)=>{
    const on = i >= weeks.length-4;
    bars += '<div class="c'+(on?' on':'')+'" style="--bar:'+color+'">'+
      (w.mark ? '<span class="mk" title="'+w.mark+'">'+(w.mark==='보강'?'▲':'●')+'</span>' : '')+
      '<span class="t">'+(on?fmt(pick(w)):'')+'</span>'+
      '<span class="b" style="height:'+Math.max(6, pick(w)/hi*100)+'%"></span></div>';
    xs += '<span'+(on?' class="on"':'')+'>'+(i>=weeks.length-4 ? (i-weeks.length+5)+'주' : '')+'</span>';
  });
  return '<div class="wk"><div class="wh"><span class="tag" style="background:'+color+'">'+chip+'</span>'+
    '<span class="meta-copy">'+title+'</span></div>'+
    '<div class="wbars">'+bars+'</div><div class="wxs">'+xs+'</div></div>';
}

/* DiagnosisEvent 기반 주차 사실 — detection/features.py와 같은 occurred_at의 월요일 버킷.
   MIN_N 미만은 막대 수치를 숨기고 판단 보류로 남긴다. */
function weeklyFactChart(title, chip, color, weeks, pick, fmt){
  const eligible=weeks.filter(w=>w.eventN>=MIN_N), vals=eligible.map(pick), hi=Math.max.apply(null,vals)||1;
  let bars='', xs='';
  weeks.forEach((w,i)=>{
    const on=i>=weeks.length-4, hold=w.eventN<MIN_N, value=hold?0:pick(w);
    bars += '<div class="c'+(on&&!hold?' on':'')+'" style="--bar:'+color+'">'+
      '<span class="t">'+(on?(hold?'보류':fmt(value)):'')+'</span>'+
      '<span class="b" style="height:'+(hold?6:Math.max(6,value/hi*100))+'%"></span></div>';
    xs += '<span'+(on?' class="on"':'')+'>'+(on?(i-weeks.length+5)+'주':'')+'</span>';
  });
  return '<div class="wk"><div class="wh"><span class="tag" style="background:'+color+'">'+chip+'</span>'+
    '<span class="meta-copy">'+title+'</span></div>'+
    '<div class="wbars">'+bars+'</div><div class="wxs">'+xs+'</div></div>';
}

function eventBreakdownHtml(r){

    '<div class="addbox"><h5>문항 형식 · 태그 확정</h5>'+r.formats.filter(x=>x.count>0).map(x=>
    '<div class="mbar"><span class="nm">'+x.label+'</span><span class="v push">'+x.count+'건</span></div>').join('')+
    '<div class="evidence"><b>강사 확정 태그</b> '+r.tagConfirmed.yes+' / '+r.tagConfirmed.total+'건 · '+pc(r.tagConfirmed.yes/r.tagConfirmed.total)+'%</div></div>';
}

function rootEvidenceHtml(r, who, meta){
  const verdictKo={weak_confirmed:'약점 확정', suspect:'약점 의심', ok:'양호'};
  const roots=r.propagated.slice().sort((a,b)=>b.score-a.score);
  const rootRows=roots.length ? roots.map(x=>'<div class="cause"><div class="ct"><span class="chip warn">근본 원인 후보</span>'+
    '<span>'+nodeLabel(x.nodeId)+'</span><span class="score">score '+x.score.toFixed(2)+'</span></div>'+
    '<div class="evidence"><b>전파 출발</b> '+x.fromNodes.map(nodeLabel).join(' · ')+'</div></div>').join(''):
    '<div class="empty">근본 원인 후보가 없습니다.</div>';
  const nodeRows=r.nodes.length ? r.nodes.map(x=>'<div class="cause"><div class="ct"><span>'+nodeLabel(x.nodeId)+'</span>'+
    '<span class="chip '+(x.verdict==='weak_confirmed'?'warn':'b')+'">'+verdictKo[x.verdict]+'</span></div>'+
    '<div class="evidence"><b>판정 근거</b> '+x.basis.join(' · ')+'</div></div>').join(''):
    '<div class="empty">표시할 노드 판정 근거가 없습니다.</div>';
  const byNode=r.misconceptions.byNode.length ? r.misconceptions.byNode.map(x=>
    '<tr><td>'+nodeLabel(x.groupKey)+'</td><td>'+MISCONCEPTION_KO[x.tag]+'</td><td class="num">'+x.count+'건</td></tr>').join(''):
    '<tr><td colspan="3" class="empty">노드별 오개념 기록이 없습니다.</td></tr>';
  return '<div class="rhead"><h3>진단 근거 · 근본 원인</h3><span class="who2">'+who+'</span></div>'+
    '<div class="rmeta">'+meta+'</div><div class="addgrid"><div><h4 class="section-heading">근본 원인 후보</h4>'+rootRows+'</div>'+
    '<div><h4 class="section-heading">노드 판정과 basis</h4>'+nodeRows+'</div></div>'+
    '<table class="facttbl"><tr><th>노드 표시</th><th>오개념</th><th class="right">빈도</th></tr>'+byNode+'</table>'+
    '<div class="note page-note">노드 ID 대신 <b>영역 × 유형 한글 표기</b>를 사용합니다. 후보 점수와 전파 출발, 판정 근거를 함께 읽어야 결론만 남지 않습니다.</div>';
}

function areaEvidenceHtml(r){
  const summary=AREA.map(a=>{
    const nodes=r.nodes.filter(x=>x.area===a.k), roots=r.propagated.filter(x=>x.area===a.k);
    const radar=r.radar.find(x=>x.area.k===a.k);
    return '<tr><td>'+a.n+'</td><td class="num">'+(radar?radar.n:0)+'문항</td>'+
      '<td class="num">'+nodes.filter(x=>x.verdict==='weak_confirmed').length+' / '+nodes.filter(x=>x.verdict==='suspect').length+' / '+roots.length+'</td></tr>';
  }).join('');
  const misconceptions=r.misconceptions.byArea.length ? r.misconceptions.byArea.map(x=>{
    const area=AREA.find(a=>a.k===x.groupKey);
    return '<tr><td>'+(area?area.n:'표시명 미확인')+'</td><td>'+MISCONCEPTION_KO[x.tag]+'</td><td class="num">'+x.count+'건</td></tr>';
  }).join(''):'<tr><td colspan="3" class="empty">영역별 오개념 기록이 없습니다.</td></tr>';
  return '<div class="addgrid"><div class="addbox"><h5>영역별 채점 모수 · 노드 판정</h5>'+
    '<table class="facttbl flush"><tr><th>영역</th><th class="right">채점</th><th class="right">확정 / 의심 / 근본</th></tr>'+summary+'</table></div>'+
    '<div class="addbox"><h5>영역별 오개념 빈도</h5><table class="facttbl flush"><tr><th>영역</th><th>오개념</th><th class="right">빈도</th></tr>'+misconceptions+'</table></div></div>'+
    '<div class="verd hold page-callout"><b>오개념 집계 제외</b> · 선택 번호 없음 '+r.misconceptions.excludedMissingChosenNo+'건 · 오개념 라벨 없음 '+r.misconceptions.excludedMissingMisconceptionTag+'건<br>'+
    '<span class="caption-copy">0건도 그대로 표시합니다. 제외 건수를 숨기면 오개념 빈도의 분모를 전체 기록으로 오해할 수 있습니다.</span></div>';
}

/* 영역 레이더 5축 — AreaTag 정본이 5영역이다.
   회색 정오각형은 이번 달 자기 평균이고, 진단결과 면의 회색 세로선과 같은 값이다.
   ⚠ KPI 카드의 회색 점선(이동 기준선)과는 다른 값이다 — 칸끼리 비교는 그 달 평균이,
   달끼리 비교는 이동 기준선이 기준이다. */
function radarSvg(rows, baseVal){
  const cx=160, cy=150, R=104, N=rows.length;
  const pt=(i,r)=>{ const a=-Math.PI/2 + i*2*Math.PI/N; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; };
  let grid='';
  [.25,.5,.75,1].forEach(f=>{
    grid += '<polygon points="'+rows.map((_,i)=>pt(i,R*f).map(v=>v.toFixed(1)).join(',')).join(' ')+
      '" fill="none" stroke="#eceef1" stroke-width="1"/>';
  });
  rows.forEach((_,i)=>{
    const p=pt(i,R); grid += '<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="#eceef1"/>';
  });
  const poly = (values,fill,stroke,dash) => '<polygon points="'+
    values.map((v,i)=>pt(i, R*(v==null?0:v)).map(n=>n.toFixed(1)).join(',')).join(' ')+
    '" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2"'+(dash?' stroke-dasharray="4 3"':'')+'/>';
  let labs='';
  rows.forEach((row,i)=>{
    const p=pt(i,R+22);
    labs += '<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+4).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937">'+row.area.n+'</text>';
  });
  return '<div><svg width="100%" viewBox="0 0 320 300">'+grid+
    poly(rows.map(()=>baseVal),'none','#c7ccd4',true)+
    poly(rows.map(r=>r.mine),'rgba(59,130,246,.22)','#3b82f6',false)+
    labs+'</svg>'+
    '<div class="rleg"><span>◆ <b>내 성취도</b></span><span class="caption-copy">◇ 내 평균 '+pc(baseVal)+'%</span></div></div>';
}

/* ── 6. 리포트 지면 — 세 화면이 공유한다 ────────────────────────── */
function sheet(r, opt){
  opt = opt || {};
  if(r.status !== 'generated') return holdSheet(r);

  const who  = r.grade+' '+r.nm+' 학생';
  const meta = '학습내역 반영 기간 &nbsp;|&nbsp; '+periodLabel(r);
  /* 3개월 추이 — FEATURE_WEEK 축적분에서 나오는 값만 그린다 */
  const a3 = [pc(r.acc)-6, pc(r.acc)-2, pc(r.acc)];
  const i3 = [Math.round(r.items*.72), Math.round(r.items*.86), r.items];
  const bandTop = ['low','medium','high'].reduce((a,b)=> r.bands[b] > r.bands[a] ? b : a, 'low');
  const bandKo  = {low:'하', medium:'중', high:'상'}[bandTop];
  const bandN   = r.bands.low + r.bands.medium + r.bands.high;
  const edits   = r.blocks.filter(isEdited).length;

  /* 면은 전부 A4 한 장이다 — 여백이 남아도 크기를 맞춘다 */
  const pages = [];
  const page  = (inner, cls) => pages.push('<div class="pg'+(cls?' '+cls:'')+'">'+inner+'</div>');
  const head  = (title) => '<div class="rhead"><h3>'+title+'</h3><span class="who2">'+who+'</span></div>';

  /* 5.1 표지 */
  page('<div class="rule">'+periodLabel(r)+'</div>'+
    '<div class="big">'+ymLabel(S.ym.y,S.ym.m)+'<br>Monthly Report</div>'+
    '<div class="sub">'+S.ym.y+'년 '+S.ym.m+'월 리포트<br>'+who+
      '<small>'+r.alias+' · '+r.id+' · '+(r.kind==='report'?'월별 일괄':'단건 수시')+'</small></div>'+
    '<div class="mark">Check<span>On</span> · 가상융합기술 아카데미</div>', 'cover');

  /* 5.2 월간 분석 */
  page(head('월간 분석')+'<div class="rmeta">'+meta+'</div>'+
    '<div class="kpis">'+
      kpi('백분위 '+r.pct, 'var(--d-blue)', r.pct, '', '전국 동일 학년 기준',
          '<div class="spark right"><span class="asof">참고치 · 기준일 '+r.pctAt+'</span></div>',
          '전국 동일 학년 표본 대비 위치입니다. <b>백엔드 집계 API 가 내려주는 단일 값</b>이라 월별 추이는 표시하지 않습니다 — 출처·모수 확정 전이라 참고치입니다.')+
      kpi('정답률 '+pc(r.acc)+'%', 'var(--d-green)', pc(r.acc), '%', '내 기준선 대비',
          spark(a3, pc(r.base.acc), 'var(--d-green)', v=>v+'%'),
          '채점 완료된 문항만 대상입니다. 회색 점선은 최근 '+r.base.weeksUsed+'주 이동 기준선으로, <b>비교 대상은 다른 학생이 아니라 본인의 평소 수준</b>입니다.')+
      kpi(r.items.toLocaleString()+'문항 채점', 'var(--d-red)', r.items.toLocaleString(), '', '내 기준선 대비',
          spark(i3, r.base.volWeek*4, 'var(--d-red)', v=>v.toLocaleString()),
          '채점이 끝난 문항 수입니다(푼 문항 수와 다릅니다). 기준선은 주당 평균 '+r.base.volWeek+'문항을 4주로 환산한 값입니다.')+
      kpi('출제 난이도 '+bandKo, 'var(--d-yellow)', bandKo, '', '',
          bandBar(r.bands),
          '체크온이 출제한 <b>'+bandN+'문항</b>의 밴드 분포입니다(하·중·상 3단계). 학원 교재·모의고사 문항은 난이도 정보가 없어 <b>모수에서 빠집니다</b> — 전체 학습량과 분모가 다릅니다.')+
    '</div>', 'monthly-pg');

  /* 선생님 의견 — 강사가 지면에서 직접 고치는 면 */
  page(head('선생님 의견')+
    '<div class="rmeta">AI 초안을 강사가 확인·수정합니다 &nbsp;|&nbsp; rev.'+revOf(r.id)+
      (edits ? ' &nbsp;|&nbsp; 강사 수정 '+edits+'문단' : '')+'</div>'+
    (opt.editable
      ? '<div class="edithint no-print">✏️ <b>문단을 눌러 그 자리에서 바로 고치세요.</b> 강사가 고친 문단은 노란 띠로 바뀌고 「강사 작성」으로 표시됩니다 — '+
        'AI 다듬기는 오른쪽 패널의 보조 수단입니다.</div>'
      : '')+
    r.blocks.map(b=>blockHtml(b, opt)).join(''));

  /* 5.3 주간 분석 */
  page(head('주간 분석')+'<div class="rmeta">'+meta+'</div>'+
    weekChart('주차별 정답률 — ▲ 보강 ● 상담 시점', '정답률 '+pc(r.acc)+'%', 'var(--d-green)', r.weeks, w=>pc(w.acc), v=>v)+
    weekChart('주차별 채점 문항 수', r.items.toLocaleString()+'문항', 'var(--d-red)', r.weeks, w=>w.vol, v=>v)+
    '<div class="addgrid mt-md">'+
      weeklyFactChart('월요일 시작 주차의 오개념 태그 건수', '오개념', 'var(--d-yellow)', r.weeks, w=>w.mis, v=>v+'건')+
      weeklyFactChart('월요일 시작 주차의 서로 다른 학습 노드 수', '노드 커버리지', 'var(--d-blue)', r.weeks, w=>w.nodeN, v=>v+'종')+
    '</div>'+
    '<div class="note page-note">⚠ <b>개입 마커가 이 차트의 핵심입니다</b> — 상담·보강 이후 흐름이 어떻게 움직였는지를 보여주는 것이 목적이고, 주차 정답률 자체는 표본이 작아 단독으로 읽지 않습니다.</div>', 'weekly-pg');

  /* 5.5 영역 × 유형 성과 */
  page(head('영역·유형별 학습 성과')+
    '<div class="rmeta">'+meta+' &nbsp;|&nbsp; 선택과목 '+r.elective+'</div>'+
    matrixHtml(r)+
    '<div class="addgrid">'+severityHtml(r)+eventBreakdownHtml(r)+'</div>'+
    '<div class="note page-note">칸 아래 숫자는 채점 문항 수입니다. <b>'+MIN_N+'문항 미만은 판정하지 않고 「판단 보류」로 둡니다</b> — 표본이 적은 칸을 약점이라고 부르면 다음 달에 뒤집힙니다.</div>');

  /* 5.6 진단 결과 */
  page(diagHtml(r, who, meta));

  /* 진단 결과 원본은 이미 A4 하단까지 차서 근거·근본 원인을 별도 면으로 나눈다 */
  page(rootEvidenceHtml(r, who, meta));

  /* 5.7 영역 레이더 */
  page(head('영역별 성취도')+'<div class="rmeta">'+meta+'</div>'+
    '<div class="rad">'+radarSvg(r.radar, r.acc)+
    '<div class="rside">'+r.radar.map(row=>
      '<div class="li"><span>'+row.area.n+'</span>'+
      '<span class="chip b">'+row.area.track+'</span>'+
      '<span class="v '+(row.mine==null?'muted':'mine')+'">'+
        (row.mine==null ? '—' : pc(row.mine)+'%')+'</span></div>').join('')+
    '</div></div>'+
    areaEvidenceHtml(r)+
    '<div class="note page-note">비교선은 <b>이번 달 내 평균</b> 하나입니다 — 영역별 전국 평균은 백엔드가 내려주는 값에 없어 그리지 않습니다. '+
    '<span class="red">반 평균·석차도 담기지 않습니다</span> — 강사 화면 전용 지표라 학부모 리포트에는 조립 단계에서 제외됩니다.</div>');

  /* 쪽번호는 면 개수가 바뀌어도 따라온다 */
  const body = pages.map((html,i)=>
    html.replace(/<\/div>$/, '<div class="pgno">'+(i+1)+' / '+pages.length+'</div></div>')).join('');

  const legend = '<div class="legend no-print">'+
    '<span><i class="fix"></i><b>확정 수치</b> — 코드·백엔드가 계산</span>'+
    '<span><i class="gen"></i><b>AI 해설</b> — 게이트 통과분</span>'+
    '<span><i class="tch"></i><b>강사 작성</b> — 직접 수정분</span>'+
    '<span class="push caption-copy">모든 면 A4 · '+pages.length+'쪽</span></div>';

  return legend + '<div class="sheet">'+body+'</div>';
}

/* 원문에서 태그를 벗긴 평문 — 강사 편집의 비교 기준이자 편집 시작값 */
const plainOf  = b => String(b.html||'').replace(/<[^>]+>/g,'');
const isEdited = b => b.owner === 'teacher';

function blockHtml(b, opt){
  const tag = b.chart
    ? '<span class="cr">chart_analysis</span><span>'+CHART[b.chart]+'</span>'
    : '<span class="cr">'+b.type+'</span><span>'+BLOCK_KO[b.type]+'</span>';

  if(!b.html) return '<div class="blk gone" data-seq="'+b.seq+'">'+
    '<div class="bt">'+tag+'<span class="own2">비움</span></div>'+
    '<div class="body2">재생성 3회 안에 근거 대조를 통과하지 못해 이 문단은 비워 두었습니다.</div></div>';

  const edited = isEdited(b);
  const cls = ['blk', edited?'tch':'', opt.editable?'editable':'', (S.blockSeq===b.seq && opt.editable)?'on':'']
    .filter(Boolean).join(' ');
  /* 강사 편집분은 평문으로 그린다 — 확정 수치 표시(.n)는 AI 원문에만 붙는다 */
  const body = edited ? esc(b.edited) : b.html;
  return '<div class="'+cls+'" data-seq="'+b.seq+'">'+
    '<div class="bt">'+tag+'<span class="own2">'+(edited?'강사 작성':'AI 해설')+'</span></div>'+
    '<div class="body2"'+(opt.editable?' contenteditable="true" data-edit="'+b.seq+'"':'')+'>'+body+'</div></div>';
}

function matrixHtml(r){
  let h = '<table class="mx"><tr><th class="a">영역 \\ 유형</th>'+
    V1_TYPE.map(t=>'<th>'+t.n+'</th>').join('')+
    '<th class="matrix-reserved">적용·창의</th></tr>';
  AREA.forEach(a=>{
    h += '<tr><td class="a">'+a.n+'<small>'+a.track+'</small></td>';
    V1_TYPE.forEach(t=>{
      const c = r.cells[a.k+'.'+t.k];
      h += '<td><span class="cell '+c.verdict+'">'+
        (c.verdict==='unknown' ? '—' : pc(c.acc)+'%')+
        '<small>'+c.n+'문항</small></span></td>';
    });
    h += '<td class="res">v1 미산출</td></tr>';
  });
  return h+'</table>';
}

function diagHtml(r, who, meta){
  const weak = ranked(r,'weak').slice(0,3), good = ranked(r,'ok').slice(0,3);
  const rows = [];
  AREA.forEach(a=>V1_TYPE.forEach(t=>{
    const c = r.cells[a.k+'.'+t.k];
    rows.push({label:a.n+' × '+t.n, c});
  }));
  const list = rows.map(x=>
    '<div class="li '+(x.c.verdict==='unknown'?'':x.c.verdict)+'">'+
    '<span class="nm">'+x.label+' <em>'+x.c.n+'문항</em></span>'+
    '<span class="bg"><span class="fg" style="width:'+(x.c.verdict==='unknown'?0:pc(x.c.acc))+'%"></span>'+
      '<span class="avg" style="left:'+pc(r.acc)+'%" title="자기 평균"></span></span>'+
    '<span class="r'+(x.c.verdict==='unknown'?' dim':'')+'">'+(x.c.verdict==='unknown'?'보류':pc(x.c.acc)+'%')+'</span></div>').join('');

  const tile = (cls,title,arr,empty) => '<div class="tl '+cls+'"><h5>'+title+'</h5>'+
    (arr.length ? arr.map(x=>'<div class="li"><span>'+x.label+'</span><span class="r">'+pc(x.acc)+'%</span></div>').join('')
                : '<div class="li none">'+empty+'</div>')+'</div>';

  return '<div class="rhead"><h3>진단 결과</h3><span class="who2">'+who+'</span></div>'+
    '<div class="rmeta">'+meta+'</div>'+
    '<div class="dg">'+
      '<div><div class="k">전체 정답률</div><div class="n2 metric-accuracy">'+pc(r.acc)+'%</div></div>'+
      '<div><div class="k">판정에 쓰인 문항 수</div><div class="n2">'+r.items.toLocaleString()+'</div></div>'+

function select(key, values, labels){
  return '<select class="sel" data-act="filter" data-k="'+key+'">'+
    values.map((v,i)=>'<option value="'+v+'"'+(S.f[key]===v?' selected':'')+'>'+labels[i]+'</option>').join('')+

function filtered(){
  return REPORTS.filter(r=>
    (S.f.cls==='all'    || r.cls===S.f.cls) &&
    (S.f.status==='all' || r.status===S.f.status) &&

}

/* 우측 패널 — 편집의 주 수단은 지면이고 여기는 상태·되돌리기·AI 보조다 */
function toolPanel(r, ro){
  if(r.status !== 'generated') return '<div class="tool"><div class="th"><b>문단 편집</b></div>'+
    '<div class="tb"><div class="verd hold">본문이 없어 편집할 대상이 없습니다.</div></div></div>';

  const cur   = S.blockSeq!=null ? r.blocks.find(b=>b.seq===S.blockSeq) : null;
  const log   = logOf(r.id);
  const edits = r.blocks.filter(isEdited).length;

  return '<div class="tool'+(ro?' ro':'')+'">'+
    '<div class="th"><b>문단 편집</b> '+
      '<span class="meta-copy">rev.'+revOf(r.id)+' · 강사 수정 '+edits+'/'+r.blocks.length+'</span>'+
      '<div class="tool-note">'+
        (ro ? '읽기 전용입니다.' : '왼쪽 지면의 문단을 눌러 <b>그 자리에서 직접</b> 고칩니다.')+'</div></div>'+
    '<div class="tb">'+

    '<div class="sec"><h4>선택한 문단</h4><div id="selBlock">'+selBlockHtml(cur)+'</div></div>'+

    '<div class="sec"><h4>편집 현황</h4>'+
      r.blocks.map(b=>
        '<div class="rev'+(isEdited(b)?' tchrev':'')+(S.blockSeq===b.seq?' cur':'')+'" data-act="goto-block" data-seq="'+b.seq+'">'+
        '<span class="no">'+b.seq+'</span><div>'+(b.chart?CHART[b.chart]:BLOCK_KO[b.type])+
        '<div class="caption-copy '+(isEdited(b)?'owner-teacher':'')+'">'+
        (isEdited(b)?'강사 작성':'AI 해설')+'</div></div>'+
        (isEdited(b)?'<span class="tail"><button class="btn sm" data-act="restore" data-seq="'+b.seq+'">AI 원문</button></span>':'')+
        '</div>').join('')+
    '</div>'+

    '<div class="verd warn"><b>강사가 쓴 문장은 검사를 거치지 않습니다.</b> AI 해설은 문장 속 수치를 확정 수치와 전수 대조하지만, '+
      '직접 수정분은 <code>draft_edit</code> 로 기록될 뿐이라 <b>차트와 어긋나도 막아 주지 않습니다</b>.</div>'+

    '<details class="sec mt-xl"><summary class="refine-summary">🤖 AI 에게 다시 쓰게 하기 (보조)</summary>'+
      '<div class="mt-sm">'+
      '<div class="scope">'+
        '<button class="'+(S.scope==='whole'?'on':'')+'" data-act="scope" data-s="whole">전체</button>'+
        '<button class="'+(S.scope==='block'?'on':'')+'" data-act="scope" data-s="block">선택 문단</button>'+
      '</div>'+
      '<div class="presets presets-spaced">'+
        '<button data-act="preset" data-p="softer">부드럽게<small>softer</small></button>'+
        '<button data-act="preset" data-p="conclusion_first">결론 먼저<small>conclusion_first</small></button>'+
        '<button data-act="preset" data-p="shorter">짧게<small>shorter</small></button>'+
      '</div>'+
      '<textarea class="instr" id="instr" placeholder="예) 마지막 문단을 두 문장으로 줄여줘"></textarea>'+
      '<div class="action-row">'+
        '<button class="btn sm" data-act="try" data-t="반 평균이랑 비교해서 써줘">차단 예시</button>'+
        '<button class="btn pri sm push" data-act="refine">다듬기 실행</button>'+
      '</div>'+
      '<div class="refine-note">'+
        '🔴 <b>강사가 고친 문단을 AI 로 다시 쓰면 수정분이 덮입니다</b> — 되돌리기는 AI 원문으로만 갑니다.</div>'+
      '<div class="mt-lg"><h4 class="section-heading">이력 · 롤백</h4>'+
        log.slice().reverse().map((t,i)=>revLine(t, i===0)).join('')+'</div>'+
      '</div></details>'+

    '</div>'+
    '<div class="tf" id="refineResult"><div class="refine-foot">'+
      (ro?'읽기 전용':'문단을 고치거나 다듬기를 실행하면 결과가 여기에 표시됩니다')+'</div></div>'+
    '</div>';
}

function selBlockHtml(cur){
  if(!cur) return '<div class="verd hold">지면에서 문단을 누르면 여기에 표시됩니다.</div>';
  const edited = isEdited(cur);
  return '<div class="box"><b>'+(cur.chart?CHART[cur.chart]:BLOCK_KO[cur.type])+'</b>'+
    '<div class="r"><span>seq · block_type</span><b>'+cur.seq+' · '+cur.type+'</b></div>'+
    '<div class="r"><span>작성 주체</span><b class="'+(edited?'owner-teacher':'owner-ai')+'">'+
      (edited?'강사 (draft_edit)':'AI (게이트 통과분)')+'</b></div>'+
    (edited ? '<div class="mt-md"><button class="btn sm" data-act="restore" data-seq="'+cur.seq+'">AI 원문으로 되돌리기</button></div>' : '')+
    '</div>';
}

function revLine(t, isLast){
  if(t.kind==='blocked'){
    const b = BLOCKED[t.reason];
    return '<div class="rev blocked"><span class="no">✕</span><div>'+esc(t.text)+
      '<div class="blocked-copy">차단 · '+b.n+' <code class="mono-copy">'+t.reason+'</code></div></div></div>';
  }
  return '<div class="rev'+(isLast?' cur':'')+'"><span class="no">rev.'+t.rev+'</span><div>'+esc(t.text)+
    (t.preset?' <span class="chip b">'+t.preset+'</span>':'')+'</div>'+
    (isLast?'':'<span class="tail"><button class="btn sm" data-act="rollback" data-r="'+t.rev+'">롤백</button></span>')+'</div>';
}

/* 와이어프레임용 정적 검사 스텁 — 실제 판정은 게이트가 한다 */
function preCheck(text){
  if(/반\s*평균|석차|등수|다른\s*학생|옆\s*반/.test(text)) return 'comparison_exposure';
  if(/실명|이름으로|전화번호|연락처/.test(text))          return 'pii_exposure';
  if(/날씨|잡담|다른\s*아이|추천\s*맛집/.test(text))       return 'out_of_scope';
  if(/모의고사|수능\s*점수|작년\s*성적/.test(text))        return 'evidence_missing';
  return null;
}

function contractPanel(){
  const row = (el,val,own,note) => '<tr><td><b>'+el+'</b></td><td>'+val+'</td><td>'+own+'</td><td>'+note+'</td></tr>';

/* ── 11. 렌더 · 이벤트 ──────────────────────────────────────────── */
function render(keepScroll){
  document.querySelectorAll('.nav .sub2').forEach(el=>{
    const v = el.getAttribute('data-v');
    el.classList.toggle('on', v===S.view || (S.view==='edit' && v==='list'));
  });
  const y = window.scrollY;
  const m = document.getElementById('main');
  m.innerHTML = S.view==='list' ? viewList() : S.view==='edit' ? viewEdit() : viewSend();
  window.scrollTo({top: keepScroll ? y : 0});
  markOverflow();
}

/* A4 한 장을 넘긴 면을 표시한다 — 와이어프레임 검토용(인쇄엔 안 나간다) */
const A4_PX = 297 * 96 / 25.4;
function markOverflow(){
  document.querySelectorAll('.pg').forEach(pg=>{
    const over = Math.round(pg.offsetHeight - A4_PX);
    if(over > 2) pg.insertAdjacentHTML('beforeend',
      '<span class="ovf no-print">A4 초과 '+over+'px — 면을 나눠야 합니다</span>');
  });
}

/* 지면에서 직접 고친다 — 포커스 때는 다시 그리지 않는다(캐럿이 날아간다) */
document.addEventListener('focusin', e=>{
  const el = e.target.closest('[data-edit]');
  if(!el) return;
  S.blockSeq = +el.getAttribute('data-edit');
  S.scope = 'block';
  const r = byId(S.openId), box = document.getElementById('selBlock');
  if(box && r) box.innerHTML = selBlockHtml(r.blocks.find(b=>b.seq===S.blockSeq));
  document.querySelectorAll('.blk').forEach(b=>
    b.classList.toggle('on', +b.getAttribute('data-seq') === S.blockSeq));
});

/* 저장은 포커스가 빠질 때 한 번 — 그때 다시 그려 배지·현황을 맞춘다 */
document.addEventListener('focusout', e=>{
  const el = e.target.closest('[data-edit]');
  if(!el) return;
  const r = byId(S.openId);
  const b = r && r.blocks.find(x=>x.seq === +el.getAttribute('data-edit'));
  if(!b) return;
  const now = el.innerText.replace(/\s+/g,' ').trim();
  const was = (isEdited(b) ? b.edited : plainOf(b)).replace(/\s+/g,' ').trim();
  if(now === was) return;

  if(!now){                       /* 비우면 AI 원문 복귀 — 빈 문단을 남기지 않는다 */
    b.owner = 'ai'; b.edited = null;
    render(true);
    showRefine('<div class="verd hold">문단을 비워서 <b>AI 원문으로 되돌렸습니다.</b></div>');
    return;
  }
  b.owner  = 'teacher';
  b.edited = now;
  render(true);
  showRefine('<div class="verd warn">✏️ <b>강사 작성으로 바뀌었습니다 — seq '+b.seq+'</b>'+
    '<div class="line"><span>기록</span><b>/confirmations · <code>kind: draft_edit</code></b></div>'+
    '<div class="line"><span>검사</span><b>없음 — 게이트·수치 대조를 안 거칩니다</b></div>'+
    '<div class="status-detail">이 수정분은 문체 프로필(STYLE_PROFILE)의 재료로 주간 배치에서 수집됩니다.</div></div>');
});

document.addEventListener('change', e=>{
  const el = e.target.closest('[data-act="filter"]');
  if(!el) return;
  S.f[el.getAttribute('data-k')] = el.value;
  render();
});

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.getAttribute('data-act'), id = el.getAttribute('data-id');

  switch(act){
    case 'view':
      S.view = el.getAttribute('data-v'); closeDrawer(); render(); break;

    case 'month': {
      const d = +el.getAttribute('data-d');
      if(d===0){ S.ym = {y:PERIOD.y, m:PERIOD.m}; }
      else { let m2 = S.ym.m + d, y2 = S.ym.y;
             if(m2<1){ m2=12; y2--; } if(m2>12){ m2=1; y2++; }
             S.ym = {y:y2, m:m2}; }
      render(); break;
    }

    case 'reset':
      S.f = {cls:'all', status:'all', kind:'all'}; render(); break;

    case 'open-edit':
      S.openId = id; S.view='edit'; S.blockSeq=null; S.scope='whole'; closeDrawer(); render(); break;

    case 'print':
      S.openId = id; S.view='edit'; render(); setTimeout(()=>window.print(), 60); break;

    case 'scope':
      S.scope = el.getAttribute('data-s'); render(true); break;

    case 'goto-block': {
      S.blockSeq = +el.getAttribute('data-seq'); S.scope = 'block'; render(true);
      const target = document.querySelector('.blk[data-seq="'+S.blockSeq+'"] [data-edit]');
      if(target) target.focus();
      break;
    }

    case 'restore': {
      const rr = byId(S.openId);
      const bb = rr.blocks.find(x=>x.seq === +el.getAttribute('data-seq'));
      bb.owner = 'ai'; bb.edited = null;
      render(true);
      showRefine('<div class="verd ok">↩ <b>AI 원문으로 되돌렸습니다 — seq '+bb.seq+'</b>'+
        '<div class="line"><span>수치 대조</span><b>다시 적용됩니다</b></div></div>');
      break;
    }

    case 'preset': {
      const p = el.getAttribute('data-p');
      applyRefine(byId(S.openId), {preset:p, text:{softer:'조금 더 부드럽게', conclusion_first:'결론을 앞으로', shorter:'더 짧게'}[p]});
      break;
    }

    case 'try': {
      const ta = document.getElementById('instr');
      if(ta){ ta.value = el.getAttribute('data-t'); ta.focus(); }
      break;
    }

    case 'refine': {
      const ta = document.getElementById('instr');
      const text = (ta && ta.value.trim()) || '';
      if(!text){ showRefine('<div class="verd hold">지시문을 입력하세요.</div>'); return; }
      applyRefine(byId(S.openId), {text});
      break;
    }

    case 'rollback': {
      const r = byId(S.openId);
      logOf(r.id).push({rev:+el.getAttribute('data-r'), kind:'refine', text:'rev.'+el.getAttribute('data-r')+' 로 롤백 (생성 없음)'});
      render(true); showRefine('<div class="verd ok">✅ <b>롤백했습니다.</b><div class="line"><span>생성</span><b>0회 — 저장된 리비전 복원</b></div></div>');
      break;
    }

    case 'toggle':
      e.stopPropagation();
      SEL.has(id) ? SEL.delete(id) : SEL.add(id); render(); break;

    case 'all': {
      const ready = REPORTS.filter(sendable);
      const allOn = ready.every(r=>SEL.has(r.id));
      ready.forEach(r=> allOn ? SEL.delete(r.id) : SEL.add(r.id));
      render(); break;
    }

    case 'open-drawer':
      openDrawer(id); break;

    case 'close-drawer':
      closeDrawer(); break;

    case 'send-one':
    case 'bulk': {
      const ids = act==='send-one' ? [id] : [...SEL];
      if(!ids.length) return;
      ids.forEach(x=>{ const r=byId(x); r.sent=true; r.sentAt='2026.09.01 10:04'; SEL.delete(x); });
      closeDrawer(); render();
      alert(ids.length+'건을 발송 대기열에 올렸습니다 (와이어프레임 — 실제 전송 없음).\n\n'+
            '\u{1F534} 발송은 BE(HITL) 소유입니다 — AI 계약에 발송 엔드포인트가 없습니다.\n'+
            '발송된 리포트는 읽기 전용으로 바뀝니다.');
      break;
    }
  }
});

function showRefine(html){
  const box = document.getElementById('refineResult');
  if(box) box.innerHTML = html;
}

function applyRefine(r, turn){
  const reason = preCheck(turn.text);
  const log = logOf(r.id);

  if(reason){
    const b = BLOCKED[reason];
    log.push({rev:revOf(r.id), kind:'blocked', text:turn.text, reason});
    render(true);
    showRefine('<div class="verd no">\u{1F534} <b>'+b.n+' — 반영하지 않았습니다.</b>'+
      '<div class="mt-sm">'+b.msg+'</div>'+
      '<div class="line"><span>응답</span><b>200 + <code>blocked_reason: '+reason+'</code></b></div>'+
      '<div class="line"><span>LLM 호출</span><b>'+(b.pre?'없음 — 사전 정적 검사':'있음 — 생성 후 게이트')+'</b></div>'+
      '</div>');
    return;
  }

  /* AI 가 다시 쓰면 그 범위의 강사 수정분은 덮인다 — 화면이 그것을 보여야 한다 */
  const scopeBlocks = S.scope === 'whole'
    ? r.blocks
    : r.blocks.filter(b => b.seq === S.blockSeq);
  const overwritten = scopeBlocks.filter(isEdited);
  overwritten.forEach(b => { b.owner = 'ai'; b.edited = null; });

  log.push({rev:revOf(r.id)+1, kind:'refine', text:turn.text, preset:turn.preset});
  render(true);
  showRefine('<div class="verd ok">✅ <b>반영했습니다 — rev.'+revOf(r.id)+'</b>'+
    '<div class="line"><span>범위</span><b>'+(S.scope==='whole'?'전체':'선택 문단')+'</b></div>'+
    '<div class="line"><span>게이트</span><b>Evidence → SourceGrounding → ToneSafety 전부 재통과</b></div>'+
    (overwritten.length
      ? '<div class="line"><span>덮어쓴 강사 수정</span><b class="teacher-copy">'+overwritten.length+'문단</b></div>'
      : '')+
    '<div class="status-detail">⚠ 와이어프레임이라 본문은 그대로입니다 — 실제로는 직전 본문 위에 지시가 <b>누적</b>됩니다.</div>'+
    '</div>');
}

render();
